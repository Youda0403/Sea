<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탑으로 가는 길</title>
<meta name="description" content="잊히기 전에, 탑에 오른다. 내 캐릭터로 감정을 뽑아 싸우는 카드 로그라이크.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --table: #d5d8cb; --table-2: #c5c9b9; --ink: #22261f; --ink-soft: #596052; --line: #a2a894;
  --card: #f2ead6; --card-ink: #2a241c; --card-edge: #c9b995;
  --mat: #93a58f; --mat-2: #7a8c77; --mat-line: rgba(255, 255, 255, .42);
  --anger: #a8392c; --calm: #34688f; --hope: #a87c12; --fear: #5b3f71; --bond: #ab4775; --mourn: #6b7378;
  --own: #34688f; --foe: #9c3128; --good: #3a7446; --bad: #9c3128; --brass: #b3862c;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #1b1613; --table-2: #2a221c; --ink: #efe5cf; --ink-soft: #b0a48b; --line: #4b3e32;
    --card: #eee3c8; --card-ink: #2a241c; --card-edge: #b9a67c;
    --mat: #2a3d33; --mat-2: #1a2921; --mat-line: rgba(238, 228, 200, .28);
    --anger: #c95140; --calm: #5b93bd; --hope: #d0a337; --fear: #8c6aa3; --bond: #cf6d97; --mourn: #8f989d;
    --own: #6a9bc4; --foe: #d05a47; --good: #7bb886; --bad: #e0765f; --brass: #d9a84e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #1b1613; --table-2: #2a221c; --ink: #efe5cf; --ink-soft: #b0a48b; --line: #4b3e32;
  --card: #eee3c8; --card-ink: #2a241c; --card-edge: #b9a67c;
  --mat: #2a3d33; --mat-2: #1a2921; --mat-line: rgba(238, 228, 200, .28);
  --anger: #c95140; --calm: #5b93bd; --hope: #d0a337; --fear: #8c6aa3; --bond: #cf6d97; --mourn: #8f989d;
  --own: #6a9bc4; --foe: #d05a47; --good: #7bb886; --bad: #e0765f; --brass: #d9a84e;
  color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--table); color: var(--ink);
  font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
h1, h2, .nm, .u-name, .h-name, .front-num { font-family: "Gowun Batang", "Nanum Myeongjo", serif; }
h1 { font-size: 1.7rem; margin: 0 0 .4rem; }
h2 { font-size: 1.1rem; margin: 0 0 .6rem; }
.soft { color: var(--ink-soft); }
.small { font-size: .8rem; }
.warn { color: var(--bad); font-weight: 600; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* ---------- 설정 ---------- */
.setup { max-width: 34rem; margin: 0 auto; padding: 1.2rem 1rem 2.5rem; }
.lead { margin: 0 0 1.2rem; color: var(--ink-soft); }
.panel { border-top: 2px solid var(--line); padding: .9rem 0 1rem; }
.panel label { display: grid; gap: .25rem; margin-bottom: .7rem; font-size: .9rem; color: var(--ink-soft); }
.panel label.inline { display: flex; align-items: center; gap: .5rem; margin: .4rem 0 0; }
.panel input, .panel select {
  font: inherit; color: var(--ink); background: var(--table-2); border: 1px solid var(--line);
  border-radius: var(--r); padding: .5rem .6rem; min-height: 2.6rem; max-width: 100%;
}
.kw-notes { margin: .2rem 0 .6rem; padding-left: 1.1rem; font-size: .88rem; }
.kw-notes li { margin-bottom: .25rem; }
.comp-row { padding: .6rem 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.comp-row:last-child { border-bottom: 0; }

/* ---------- 버튼 ---------- */
.btn {
  background: var(--table-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: .55rem .75rem; min-height: 2.75rem; cursor: pointer; font-size: .88rem; line-height: 1.25;
  align-content: center;
}
.btn small { display: block; font-size: .72rem; color: var(--ink-soft); }
.btn:disabled { opacity: .42; cursor: default; }
.btn.primary { background: var(--ink); color: var(--table); border-color: var(--ink); font-weight: 600; }
.btn.primary small { color: inherit; opacity: .8; }
.btn.ghost { background: transparent; }
.btn.crisis:not(:disabled) { border-color: var(--bad); color: var(--bad); font-weight: 600; }
.btn.big { width: 100%; min-height: 3.2rem; font-size: 1rem; margin-top: .6rem; }

/* ---------- 전투 레이아웃 ---------- */
.battle { max-width: 34rem; margin: 0 auto; padding: .6rem .6rem 2rem; display: grid; gap: .6rem; }
.top { display: grid; gap: .5rem; }

/* 전선: 이 화면의 주인공 */
.front { background: var(--table-2); border-radius: var(--r); padding: .55rem .6rem .6rem; }
.front-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .75rem; color: var(--ink-soft); }
.front-num { font-size: 1.25rem; color: var(--ink); }
.front-track { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; margin-top: .35rem; height: 1.6rem; }
.fc { position: relative; border-radius: 2px; }
.fc.own { background: color-mix(in srgb, var(--own) 28%, transparent); }
.fc.foe { background: color-mix(in srgb, var(--foe) 28%, transparent); }
.fc.own.push { background: color-mix(in srgb, var(--own) 55%, transparent); }
.fc.foe.push { background: color-mix(in srgb, var(--foe) 55%, transparent); }
.fc.mid { background: var(--line); }
.fc:first-child, .fc:last-child { outline: 2px solid var(--ink); outline-offset: -2px; }
.marker {
  position: absolute; inset: -5px 50% -5px auto; width: 6px; transform: translateX(50%);
  background: var(--brass); border-radius: 3px; box-shadow: 0 0 0 2px var(--table-2);
}
.front-state { font-size: .78rem; margin-top: .35rem; font-weight: 600; }

.status { display: grid; grid-template-columns: 1fr auto; gap: .35rem 1rem; align-items: center; padding: 0 .15rem; }
.stress-head { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-soft); }
.stress-head b { font-size: 1rem; color: var(--ink); }
.stress-bar { position: relative; height: .55rem; background: var(--table-2); border-radius: 3px; overflow: hidden; margin: .15rem 0; }
.stress-bar i { position: absolute; inset: 0 auto 0 0; background: var(--fear); }
.stress-bar s { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--table); }
.nums { display: flex; gap: 1rem; }
.nums div { display: grid; text-align: center; }
.nums span { font-size: .72rem; color: var(--ink-soft); }
.nums b { font-size: 1.15rem; line-height: 1.1; }
.effs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem; }
.eff { font-size: .74rem; padding: .15rem .4rem; border-radius: 4px; border: 1px solid; }
.eff.good { color: var(--good); } .eff.bad { color: var(--bad); }

/* ---------- 보드 ---------- */
.board { display: grid; gap: .35rem; }
.row-wrap { display: grid; grid-template-columns: 1.6rem 1fr; align-items: stretch; gap: .3rem; }
.row-label { writing-mode: vertical-rl; text-orientation: upright; font-size: .72rem; color: var(--ink-soft); text-align: center; letter-spacing: .1em; }
.row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .35rem; }
.row-wrap.p { margin-top: .35rem; padding-top: .5rem; border-top: 2px dashed var(--line); }
.slot {
  position: relative; min-height: 5.6rem; border-radius: var(--r); padding: .3rem .3rem .25rem;
  display: grid; grid-template-rows: auto 1fr auto auto; text-align: left; cursor: pointer;
}
.slot.empty { background: transparent; border: 1.5px dashed var(--line); }
.slot.unit { background: var(--card); color: var(--card-ink); border: 1px solid var(--card-edge); box-shadow: 0 1px 0 var(--card-edge); }
.row-wrap.t .slot { min-height: 4.6rem; }
.row-wrap.t .slot.unit { opacity: .62; border-style: dashed; }
.row-wrap.e .slot.unit { border-top: 3px solid var(--foe); }
.row-wrap.p .slot.unit { border-bottom: 3px solid var(--own); }
.slot.comp { border-bottom-color: var(--bond) !important; }
.slot.target { border: 2px solid var(--brass); background: color-mix(in srgb, var(--brass) 14%, transparent); }
.slot.unit.target { background: var(--card); box-shadow: 0 0 0 2px var(--brass); }
.slot.picked { box-shadow: 0 0 0 3px var(--brass); }
.u-name { font-size: .78rem; font-weight: 700; line-height: 1.2; word-break: keep-all; }
.u-sig { font-size: .68rem; color: #6b6152; line-height: 1.2; }
.u-badges { display: flex; flex-wrap: wrap; gap: 2px; }
.u-stats { display: flex; justify-content: space-between; font-size: .95rem; }
.u-stats b { min-width: 1.4rem; text-align: center; border-radius: 3px; padding: 0 .15rem; }
.atk { color: var(--anger); } .hp { color: #2f6a3b; }
.atk.up { background: color-mix(in srgb, var(--anger) 16%, transparent); }
.atk.down { text-decoration: underline wavy; }
.bd { font-style: normal; font-size: .64rem; padding: 0 .25rem; border-radius: 3px; border: 1px solid currentColor; line-height: 1.4; }
.bd.comp { color: var(--bond); } .bd.bad { color: var(--bad); } .bd.good { color: var(--good); }
/* 카드 안쪽은 늘 종이색이므로 고정 잉크를 씁니다 */
.slot.unit .bd.comp { color: #a8466f; } .slot.unit .bd.bad { color: #a33e2a; } .slot.unit .bd.good { color: #3a7446; }
.slot.unit .atk { color: #b0432b; }

/* ---------- 토큰 ---------- */
.tokens { display: grid; gap: .3rem; }
.tok-row { display: flex; flex-wrap: wrap; gap: .35rem; min-height: 2.6rem; align-items: center; }
.tok {
  min-width: 3.1rem; min-height: 2.5rem; padding: .2rem .5rem; border-radius: 999px; border: 2px solid transparent;
  color: #fff; font-weight: 600; font-size: .85rem; cursor: pointer; display: grid; place-items: center; line-height: 1.1;
}
.tok small { font-size: .62rem; font-weight: 500; }
.t-anger { background: var(--anger); } .t-calm { background: var(--calm); } .t-hope { background: var(--hope); }
.t-fear { background: var(--fear); } .t-bond { background: var(--bond); } .t-mourn { background: var(--mourn); }
.tok.extra { border-style: dashed; border-color: var(--ink); }
.tok.keep { outline: 3px solid var(--brass); outline-offset: 1px; }
.tok.target { box-shadow: 0 0 0 3px var(--brass); }
.tok.picked { outline: 3px solid var(--ink); }

/* ---------- 안내, 행동 ---------- */
.info { min-height: 3rem; background: var(--table-2); border-radius: var(--r); padding: .5rem .65rem; font-size: .86rem; }
.info ul { margin: .3rem 0; padding-left: 1.1rem; }
.toast { color: var(--bad); font-weight: 600; margin-bottom: .2rem; }
.actions { display: grid; gap: .45rem; }
.act-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem; }
.btn.act { display: grid; gap: .1rem; text-align: left; align-content: center; padding: .5rem .6rem; }
.btn.act b { font-size: .88rem; }
.btn.act small { font-size: .72rem; line-height: 1.3; }
.end-row { display: flex; gap: .4rem; }
.end-row .btn.ghost { flex: 0 0 5rem; }
.btn.end { flex: 1; min-height: 3.1rem; font-size: 1rem; }

/* ---------- 손패 ---------- */
.hand { display: flex; gap: .45rem; overflow-x: auto; padding: .2rem .1rem .5rem; scroll-snap-type: x proximity; }
.empty-hand { justify-content: center; }
.hcard {
  flex: 0 0 6.6rem; min-height: 8rem; background: var(--card); color: var(--card-ink); border: 1px solid var(--card-edge);
  border-radius: var(--r); padding: .4rem; display: grid; grid-template-rows: auto auto 1fr auto; gap: .15rem;
  text-align: left; cursor: pointer; scroll-snap-align: start;
}
.hcard.comp { border-bottom: 3px solid #a8466f; }
.hcard.desp { background: #e7dfe9; }
.hcard.dim { opacity: .55; }
.hcard.sel { box-shadow: 0 0 0 3px var(--brass); transform: translateY(-3px); }
.hcard .atk { color: #b0432b; }
.hcard .bd.bad { color: #a33e2a; }
.h-name { font-size: .88rem; font-weight: 700; line-height: 1.2; word-break: keep-all; }
.h-sig { font-size: .7rem; color: #6b6152; }
.cost { display: flex; gap: 2px; }
.pip { font-style: normal; width: 1.25rem; height: 1.25rem; border-radius: 50%; color: #fff; font-size: .66rem; display: grid; place-items: center; font-weight: 600; }

/* ---------- 기록 ---------- */
.log { border-top: 2px solid var(--line); padding-top: .4rem; }
.log summary { cursor: pointer; font-size: .88rem; color: var(--ink-soft); padding: .35rem 0; min-height: 2.2rem; }
.log ol { list-style: none; margin: .2rem 0 0; padding: 0; font-size: .82rem; display: grid; gap: .2rem; }
.lg { display: grid; grid-template-columns: 1.6rem 1fr; }
.lt { color: var(--ink-soft); font-size: .72rem; }
.lg.good { color: var(--good); } .lg.bad { color: var(--bad); }
.lg.line { font-family: "Gowun Batang", serif; color: var(--ink); }

/* ---------- 시트 ---------- */
.sheet { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: grid; align-items: end; z-index: 10; }
.sheet-body {
  background: var(--table); border-radius: 14px 14px 0 0; padding: 1.1rem 1rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
  max-width: 34rem; width: 100%; margin: 0 auto; display: grid; gap: .6rem;
}
.sheet-body h2 { font-size: 1.35rem; margin: 0; }
.sheet-body p { margin: 0; }
.emo-pick { display: flex; gap: .5rem; }
.emo-pick .tok { flex: 1; min-height: 3rem; }
.sac { display: grid; gap: .4rem; }
.res-btns { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }

@media (min-width: 640px) {
  .act-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .slot { min-height: 6.4rem; }
  .u-name { font-size: .88rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .hcard { transition: transform .12s ease; }
}

/* ---------- 토큰 개수, 주머니 ---------- */
.tok-head { display: flex; justify-content: space-between; align-items: baseline; }
.tok-head b { font-size: .9rem; }
.pouch { border-top: 1px dashed var(--line); padding-top: .35rem; display: grid; gap: .25rem; }
.pouch-head { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-soft); }
.pouch-head .risk { color: var(--bad); font-weight: 600; }
.pouch-row { display: flex; flex-wrap: wrap; gap: .25rem .6rem; }
.pc { display: inline-flex; align-items: center; gap: .25rem; font-size: .8rem; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; display: inline-block; }

/* ---------- 턴 진행 연출 ---------- */
.battle.playing .hand, .battle.playing .tokens { opacity: .45; pointer-events: none; }
.caption { font-size: .95rem; }
.pop {
  position: absolute; left: 50%; top: 32%; transform: translate(-50%, 0);
  font-weight: 700; font-size: 1.15rem; color: #fff; background: var(--bad);
  padding: 0 .4rem; border-radius: 4px; pointer-events: none; z-index: 2;
}
.front-track .fc { overflow: visible; }
.front-pop { top: -1.9rem; font-size: .9rem; }
.front-pop.p { background: var(--own); }
.front-pop.e { background: var(--foe); }
.slot.fx-hit::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); background: color-mix(in srgb, var(--bad) 30%, transparent); pointer-events: none; }
.slot.fx-die { opacity: .35; filter: grayscale(1); }
.slot.fx-lunge-p, .slot.fx-lunge-e { box-shadow: 0 0 0 3px var(--brass); z-index: 1; }
@media (prefers-reduced-motion: no-preference) {
  .slot.fx-lunge-p { animation: lunge-up .5s ease; }
  .slot.fx-lunge-e { animation: lunge-down .5s ease; }
  .slot.fx-hit { animation: shake .4s ease; }
  .slot.fx-die { animation: fade-out .44s ease forwards; }
  .slot.fx-drop { animation: drop .45s ease; }
  .pop { animation: pop-up .55s ease forwards; }
  .marker.pulse { animation: pulse .55s ease; }
  @keyframes lunge-up { 0% { transform: none; } 40% { transform: translateY(-14px); } 100% { transform: none; } }
  @keyframes lunge-down { 0% { transform: none; } 40% { transform: translateY(14px); } 100% { transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @keyframes fade-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.85); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
  @keyframes pop-up { from { opacity: 0; transform: translate(-50%, 6px); } 30% { opacity: 1; } to { opacity: 1; transform: translate(-50%, -14px); } }
  @keyframes pulse { 0% { transform: translateX(50%) scale(1); } 50% { transform: translateX(50%) scale(1.6); } 100% { transform: translateX(50%) scale(1); } }
}

.tokens.placeholder { min-height: 8.6rem; align-content: start; }

/* ---------- 범위 표시 ---------- */
.u-stats { align-items: center; }
.u-stats b { flex: 0 0 auto; }
.rng { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: .62rem; color: #6b6152; border: 1px solid #c9bc9f; border-radius: 3px; padding: 0 .2rem; line-height: 1.4; white-space: nowrap; }
.slot.rg-src { box-shadow: 0 0 0 3px var(--ink); z-index: 1; }
.slot.rg-atk { box-shadow: 0 0 0 3px var(--bad); }
.slot.empty.rg-atk { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); }
.slot.rg-guard { box-shadow: 0 0 0 3px var(--calm); }
.slot.empty.rg-guard { background: color-mix(in srgb, var(--calm) 14%, transparent); border-color: var(--calm); }
.slot.rg-buff { box-shadow: 0 0 0 3px var(--hope); }
.slot.empty.rg-buff { background: color-mix(in srgb, var(--hope) 14%, transparent); border-color: var(--hope); }
.rtag {
  position: absolute; left: 50%; bottom: -.6rem; transform: translateX(-50%); white-space: nowrap;
  font-size: .66rem; font-weight: 700; color: #2b2620; background: #fffaf0; border: 2px solid var(--bad);
  padding: 0 .3rem; border-radius: 4px; z-index: 3; line-height: 1.45;
}
.rtag.guard { border-color: var(--calm); } .rtag.buff { border-color: var(--hope); }
.front { position: relative; }
.front.rg-front { box-shadow: 0 0 0 3px var(--bad); }
.front-tag { bottom: auto; top: -.5rem; }
.bd.new { color: var(--brass); }
.slot.unit .bd.new { color: #8a6a22; }

/* 손패 카드 설명의 작은 도식 */
.range-box { display: grid; grid-template-columns: auto 1fr; gap: .6rem; align-items: start; margin-top: .35rem; }
.mini { display: grid; gap: 3px; width: 7.2rem; }
.mini-front { font-size: .62rem; text-align: center; border-radius: 3px; background: var(--line); color: var(--table); line-height: 1.6; }
.mini-front.on { background: var(--bad); color: #fff; font-weight: 600; }
.mini-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.mc { height: 1.7rem; border-radius: 3px; font-size: .6rem; display: grid; place-items: center; border: 1px dashed var(--line); }
.mc.atk { background: var(--bad); color: #fff; border: 0; }
.mc.fly { background: color-mix(in srgb, var(--bad) 30%, transparent); border: 1px solid var(--bad); }
.mc.buff { background: var(--hope); color: #fff; border: 0; }
.mc.guard { background: var(--calm); color: #fff; border: 0; }
.mc.self { background: var(--ink); color: var(--table); border: 0; font-weight: 600; }
.rlist { margin: 0; padding-left: 1rem; font-size: .82rem; }
.rlist li { margin-bottom: .15rem; }

/* 되돌리기 */
.btn.undo { flex: 0 0 auto; max-width: 42%; display: grid; text-align: left; }
.btn.undo small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn.takeback { margin-top: .4rem; width: 100%; border-color: var(--brass); font-weight: 600; }
.slot.rg-fly { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 55%, transparent); }
.slot.empty.rg-fly { border-color: var(--bad); }
.rtag.fly { border-style: dashed; }

.end-lose { color: var(--own); font-weight: 600; } .end-win { color: var(--foe); font-weight: 600; }

/* ---------- 로스터, 캐릭터 제작 ---------- */
.nav { display: flex; justify-content: space-between; margin-bottom: .6rem; }
.av { width: 2.2rem; height: 2.2rem; border-radius: 50%; object-fit: cover; flex: 0 0 auto; display: inline-grid; place-items: center; vertical-align: middle; }

.rlist-wrap { display: grid; gap: .1rem; }
.rc { display: grid; grid-template-columns: auto 1fr auto; gap: .7rem; align-items: center; padding: .5rem 0; border-bottom: 1px dashed var(--line); }

.toast { color: var(--bad); font-weight: 600; }
.code { width: 100%; font: .78rem/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--ink); background: var(--table-2); border: 1px solid var(--line); border-radius: var(--r); padding: .5rem; margin: .4rem 0; word-break: break-all; }

.ed-name label { margin-bottom: .5rem; }
.line-f { display: grid; gap: .2rem; margin-bottom: .6rem; font-size: .85rem; }
.line-f textarea { font: inherit; font-size: .88rem; color: var(--ink); background: var(--table-2); border: 1px solid var(--line); border-radius: var(--r); padding: .45rem .55rem; resize: vertical; }
.rel { justify-content: space-between; margin: .35rem 0; }
.rel select { flex: 0 0 55%; }
.pick { display: flex; gap: .6rem; align-items: center; margin: .2rem 0 .4rem; }
.two { display: flex; gap: 1rem; flex-wrap: wrap; }
.pv-row { display: flex; gap: .8rem; align-items: flex-start; }
.hcard.pv { cursor: default; position: relative; }

.ed-actions { display: grid; gap: .5rem; margin-top: .6rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.hcard, .slot { position: relative; }
.panel label > select, .panel label > input { width: 100%; min-width: 0; }
.panel label.inline > select { width: auto; }

/* ---------- 야영 ---------- */
.camp h1 { margin-bottom: .6rem; }
.camp-stat { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; margin-bottom: .4rem; }

.camp-opt { margin-bottom: 1rem; }

.opt-btn { width: 100%; display: flex; align-items: center; gap: .6rem; text-align: left; margin-bottom: .4rem; padding: .6rem .7rem; }

.scene { display: grid; gap: .6rem; margin-bottom: .8rem; }
.bubble { display: flex; gap: .6rem; align-items: flex-start; }

/* ---------- 궁극기, 합동 ---------- */
.res { display: inline-flex; gap: 2px; align-items: center; font-style: normal; }

@media (prefers-reduced-motion: no-preference) {

}


/* ================= 디자인 다듬기: 촛불 탁자 위의 카드 게임 ================= */
html { background-color: var(--table); }
body { background: radial-gradient(ellipse 120% 520px at 50% 0%, color-mix(in srgb, var(--brass) 12%, var(--table)) 0%, var(--table) 100%) no-repeat, var(--table); min-height: 100vh; }

/* 보드: 화면의 주인공. 황동 테두리를 두른 펠트 매트 */
.board {

  border-radius: 14px; padding: .7rem .55rem .8rem;

}
.row-label { color: var(--mat-line); color: color-mix(in srgb, #fff 78%, transparent); font-weight: 600; }
.row-wrap.p { border-top: 1.5px dashed var(--mat-line); }
.slot.empty { border: 1.5px dashed var(--mat-line); background: rgba(0, 0, 0, .07); }

/* 종이 카드 */

}

}
.row-wrap.e .slot.unit { border-top: 3px solid var(--foe); }
.row-wrap.p .slot.unit { border-bottom: 3px solid var(--own); }
.row-wrap.t .slot.unit { opacity: .7; border-style: dashed; box-shadow: none; }
.u-name, .h-name { letter-spacing: -.01em; }
.u-sig, .h-sig { color: #6f624c; }

/* 공격력은 검붉은 원, 체력은 녹색 방패 */
.u-stats b.atk, .u-stats b.hp {
  display: inline-grid; place-items: center; min-width: 1.55rem; height: 1.55rem; padding: 0 .2rem;
  color: #fff; font-size: .84rem; font-weight: 700; line-height: 1;
}
.u-stats b.atk, .slot.unit .atk, .hcard .atk { background: #8e2d24; color: #fff; border-radius: 50%; }
.u-stats b.hp { background: #3c6a42; color: #fff; border-radius: 4px 4px 9px 9px; }
.u-stats b.atk.up { background: #8e2d24; box-shadow: 0 0 0 2px #d9a84e; }
.u-stats b.atk.down { text-decoration: none; background: #7a6f64; }
.rng { color: #6f624c; border-color: #cdbf9d; background: rgba(255, 255, 255, .4); }

/* 손패 */
.hand { gap: .55rem; padding: .35rem .15rem .7rem; }
.hcard { flex-basis: 6.8rem; }
.hcard.sel { box-shadow: 0 0 0 3px var(--brass), 0 10px 18px rgba(20, 14, 8, .35); transform: translateY(-6px); }
.hcard.dim { opacity: .5; filter: saturate(.6); }
.hcard.desp { background: linear-gradient(180deg, #efe6f0 0%, #e2d6e6 100%); }
.pip { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5); }

/* 감정 토큰은 칩처럼 */
.tok { position: relative; box-shadow: 0 2px 0 rgba(0, 0, 0, .28), inset 0 -2px 0 rgba(0, 0, 0, .18); background-image: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .32), transparent 55%); }

.tok.extra::after { border-color: rgba(255, 255, 255, .9); }
.tok.extra { border-color: transparent; }
.dot { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45); }

/* 전선 게이지 */
.front { background: var(--table-2); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.front-track { gap: 3px; }
.fc { border-radius: 3px; }
.fc.mid { background: var(--ink-soft); }
.marker { background: radial-gradient(circle at 35% 30%, #f3d78f, var(--brass) 60%); width: 9px; border-radius: 5px; box-shadow: 0 0 0 2px var(--table-2), 0 2px 6px rgba(0, 0, 0, .35); }

/* 버튼 */
.btn { border-radius: 8px; box-shadow: 0 1px 0 rgba(0, 0, 0, .12); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--brass) 88%, #fff) 0%, var(--brass) 100%); color: #21180c; border-color: color-mix(in srgb, var(--brass) 70%, #000); }
.btn.primary small { color: #21180c; }
.btn.act { background: var(--table-2); }
.btn.act b { font-family: "Gowun Batang", serif; font-size: .95rem; }
.btn.crisis:not(:disabled) { background: color-mix(in srgb, var(--bad) 10%, var(--table-2)); }

/* 안내창과 패널 */
.info { background: var(--table-2); border-left: 3px solid var(--brass); border-radius: 4px 10px 10px 4px; }
.tokens { background: var(--table-2); border-radius: 12px; padding: .55rem .6rem .5rem; }
.pouch { border-top-color: var(--line); }
.setup .panel { border-top: 1px solid var(--line); }
.setup h1 { font-size: 1.9rem; letter-spacing: -.02em; }
.rc .av.lg, .camp-row .av.lg, .pick .av.lg { box-shadow: 0 0 0 2px var(--table), 0 0 0 3.5px var(--brass); }
.bubble > div { box-shadow: 0 3px 8px rgba(20, 14, 8, .18); }
.sheet-body { box-shadow: 0 -8px 30px rgba(0, 0, 0, .3); }
.sheet-body h2 { font-size: 1.5rem; }

/* ---------- 맵 런 ---------- */
.center { text-align: center; }
.run-head { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; margin: .2rem 0 .4rem; }
.run-tools { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-bottom: .5rem; }
.btn.small-btn { min-height: 2.2rem; padding: .3rem .6rem; font-size: .8rem; }
.relic { font: inherit; font-size: .74rem; padding: .2rem .5rem; border-radius: 999px; border: 1px solid var(--brass); background: color-mix(in srgb, var(--brass) 14%, transparent); color: var(--ink); cursor: pointer; }
.map { position: relative; margin: .6rem 0 1rem; border-radius: 14px;
  background: radial-gradient(ellipse 90% 70% at 50% 40%, var(--mat) 0%, var(--mat-2) 100%);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--brass) 55%, transparent), inset 0 3px 22px rgba(0, 0, 0, .28); }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map line { stroke: var(--mat-line); stroke-width: 2; stroke-dasharray: 4 5; }
.map line.walked { stroke: var(--brass); stroke-dasharray: none; stroke-width: 3; }
.fl { position: absolute; left: .4rem; transform: translateY(-50%); font-size: .68rem; color: color-mix(in srgb, #fff 70%, transparent); }
.node {
  position: absolute; transform: translate(-50%, -50%); min-width: 3.3rem; height: 2.3rem; padding: 0 .5rem; border-radius: 999px;
  font: 600 .78rem/1 "IBM Plex Sans KR", sans-serif; color: #2a241c; background: #efe6d0; border: 2px solid #b9a67c; cursor: pointer;
  box-shadow: 0 2px 0 rgba(40, 28, 14, .35);
}
.node:disabled { cursor: default; opacity: .55; }
.node.visited { opacity: .8; background: #d9ceb3; }
.node.current { box-shadow: 0 0 0 3px var(--brass), 0 2px 0 rgba(40, 28, 14, .35); opacity: 1; }
.node.reach { opacity: 1; border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 45%, transparent), 0 3px 10px rgba(0, 0, 0, .3); }
.n-elite { background: #e9d3cf; border-color: #9c3128; color: #7a2019; }
.n-boss { background: #3a2a22; color: #f3d78f; border-color: #d9a84e; min-width: 4rem; height: 2.6rem; }
.n-camp { background: #f1dfb4; }
.n-event { background: #e0dcee; }
.n-trade { background: #d8e6d6; }
@media (prefers-reduced-motion: no-preference) {
  .node.reach { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--brass) 25%, transparent), 0 3px 10px rgba(0, 0, 0, .3); } }
}
.event-card h1 { margin-top: .2rem; }
.story { font-family: "Gowun Batang", serif; font-size: 1.02rem; line-height: 1.75; }
.story.result { border-left: 3px solid var(--brass); padding-left: .7rem; }
.card-row { display: flex; gap: .55rem; overflow-x: auto; padding: .3rem .1rem .6rem; }
.card-row.wrap { flex-wrap: wrap; overflow: visible; }
.hcard.deckcard { flex: 0 0 6.8rem; min-height: 8.4rem; }
.hcard.sold { display: grid; place-items: center; color: #8a7d66; }
.hcard.awk { box-shadow: 0 0 0 2px #d9a84e, 0 5px 12px rgba(20, 14, 8, .28); }
.hcard.fused { background: linear-gradient(135deg, #f6efdc 0%, #e8ddc2 50%, #f1e6cb 100%); }
.price { font-size: .72rem; font-weight: 700; color: #6b4d12; }
.xp { display: inline-flex; gap: 2px; }
.xp i { width: .4rem; height: .4rem; border-radius: 50%; border: 1px solid #8e2d24; display: inline-block; }
.xp i.on { background: #8e2d24; }
.deck-sheet { max-height: 86vh; overflow-y: auto; }
.fuse-prev { display: flex; align-items: center; gap: .6rem; padding: .5rem; border-radius: 10px; background: color-mix(in srgb, var(--brass) 14%, transparent); }
.relic-get { display: grid; padding: .6rem .8rem; border-radius: 10px; border: 2px solid var(--brass); margin: .4rem 0; }
.note.good { color: var(--good); font-weight: 600; }

/* ---------- 카드 설명 창 ---------- */
.sheet.top { z-index: 20; }
.cd-top { display: flex; gap: .8rem; align-items: flex-start; }
.cd-top .hcard { flex: 0 0 6.8rem; cursor: default; }
.cd-top .nm { font-size: 1.15rem; }

/* ---------- 보스, 엘리트 강조 ---------- */
.slot.boss-unit {
  background: linear-gradient(180deg, #3b2a21 0%, #231812 100%); color: #f3e6c4;
  border: 2px solid #d9a84e !important; box-shadow: 0 0 0 2px rgba(217, 168, 78, .3), 0 0 20px rgba(217, 168, 78, .5);
}
.slot.boss-unit::before { border-color: rgba(217, 168, 78, .55); }
.slot.boss-unit .u-name { color: #f3d78f; font-size: .9rem; }
.slot.boss-unit .u-sig, .slot.boss-unit .rng { color: #e5d3a8; border-color: rgba(217, 168, 78, .5); background: transparent; }
.slot.elite-unit { border: 2px solid #9c3128 !important; box-shadow: 0 0 0 2px rgba(156, 49, 40, .25), 0 0 14px rgba(156, 49, 40, .35); }
.bd.crown, .slot.unit .bd.crown { color: #f3d78f; border-color: #d9a84e; background: #3a2a22; }
.battle.boss-fight .board { background: radial-gradient(ellipse 90% 80% at 50% 45%, #45302a 0%, #1f1512 100%); box-shadow: inset 0 0 0 1.5px #d9a84e, inset 0 3px 26px rgba(0, 0, 0, .45); }

/* ---------- 엮기·각성·보스 연출 ---------- */
.reveal {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; align-content: center; gap: 1.6rem;
  background: radial-gradient(circle at 50% 42%, rgba(46, 32, 12, .9), rgba(10, 8, 5, .96)); color: #f3e6c4; cursor: pointer; overflow: hidden;
  padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
}
.reveal.boss { background: radial-gradient(circle at 50% 42%, rgba(80, 24, 18, .92), rgba(12, 6, 5, .97)); }
.rv-rays {
  position: absolute; width: 170vmax; height: 170vmax; left: 50%; top: 42%; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg, rgba(217, 168, 78, .16) 0deg 7deg, transparent 7deg 20deg); pointer-events: none;
}
.reveal.boss .rv-rays { background: repeating-conic-gradient(from 0deg, rgba(208, 90, 71, .16) 0deg 7deg, transparent 7deg 20deg); }
.rv-card, .rv-src, .rv-text { position: relative; }
.rv-card .hcard { transform: scale(1.35); box-shadow: 0 0 0 3px #d9a84e, 0 0 44px rgba(217, 168, 78, .75); cursor: pointer; }
.rv-src { position: absolute; left: 0; right: 0; top: 42%; height: 0; }
.rv-from { position: absolute; top: 0; transform: translate(-50%, -50%); }
.rv-from-0 { left: 50%; } .rv-from-1 { left: 50%; }
.reveal.fuse .rv-from { opacity: 0; }
.rv-text { display: grid; gap: .35rem; text-align: center; max-width: 22rem; }
.rv-text b { font-family: "Gowun Batang", serif; font-size: 2rem; color: #f3d78f; letter-spacing: -.01em; }
.rv-text span { font-family: "Gowun Batang", serif; font-size: 1.02rem; line-height: 1.6; }
.rv-text small { color: #b8a57c; margin-top: .4rem; }
@media (prefers-reduced-motion: no-preference) {
  .rv-rays { animation: spin 22s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .reveal { animation: fade-in .35s ease; }
  @keyframes fade-in { from { opacity: 0; } }
  .reveal.fuse .rv-from-0 { animation: merge-l .9s ease-in forwards; }
  .reveal.fuse .rv-from-1 { animation: merge-r .9s ease-in forwards; }
  @keyframes merge-l { 0% { opacity: 1; transform: translate(-150%, -50%) rotate(-8deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.8); } }
  @keyframes merge-r { 0% { opacity: 1; transform: translate(50%, -50%) rotate(8deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.8); } }
  .reveal.fuse .rv-card { animation: pop-in .6s .85s cubic-bezier(.2, 1.6, .4, 1) both; }
  .reveal.fuse .rv-text { animation: fade-in .5s 1.2s both; }
  .reveal.awaken .rv-card { animation: pop-in .7s cubic-bezier(.2, 1.6, .4, 1) both, glow 1.8s .7s ease-in-out infinite; }
  .reveal.awaken .rv-text { animation: fade-in .5s .5s both; }
  .reveal.boss .rv-text b { animation: pop-in .7s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes glow { 50% { filter: drop-shadow(0 0 18px rgba(243, 215, 143, .9)); } }
}

/* ---------- v0.10: 카드 넘침 방지 ---------- */
.slot { container-type: inline-size; }
@container (max-width: 84px) {
  .slot .rng { display: none; }
  .slot .u-stats b.atk, .slot .u-stats b.hp { min-width: 1.3rem; height: 1.3rem; font-size: .74rem; }

}
.u-stats { min-width: 0; gap: 2px; }
.u-name, .u-sig { overflow-wrap: anywhere; }

/* 버프 표시 */
.atk-wrap { position: relative; display: inline-grid; }
.delta { position: absolute; top: -.62rem; right: -.55rem; font-style: normal; font-size: .62rem; font-weight: 700; line-height: 1.35;
  background: #d9a84e; color: #21180c; border-radius: 6px; padding: 0 .22rem; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }

/* 관계 배지 */
.bd.link, .slot.unit .bd.link, .hcard .bd.link { color: #fff; background: #ab4775; border-color: #ab4775; }
.joint-line.pro { border-left-color: #ab4775; }

/* 덱 정보 */
.hand-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-size: .85rem; margin-bottom: -.2rem; }

function rint(n) { return Math.floor(rng() * n); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function jo(w, a, b) {
  const s = String(w); const ch = s.charCodeAt(s.length - 1);
  if (ch < 0xAC00 || ch > 0xD7A3) return s + a;
  const f = (ch - 0xAC00) % 28;
  if (a === '으로') return s + (f === 0 || f === 8 ? '로' : '으로');
  return s + (f ? a : b);
}

function linesFor(ch, kind) {
  const raw = ch.lines && ch.lines[kind];
  const custom = raw ? String(raw).split('\n').map(x => x.trim()).filter(Boolean) : [];
  if (custom.length) return custom;
  const base = (DEFAULT_LINES[ch.speech] || DEFAULT_LINES.ban)[kind] || [];
  // 핵심 키워드 대사를 두 번 넣어 성격이 더 자주 드러나게 합니다
  const i = KW_LINE_KINDS.indexOf(kind); const set = KW_LINES[ch.core] && (KW_LINES[ch.core][ch.speech] || KW_LINES[ch.core].ban);
  const mine = i >= 0 && set && !ch.merc ? [set[i]] : [];
  return [...base, ...mine, ...mine];
}

let S = null;

function undo() {

  const u = UNDO.pop();
  S = u.state; S.events = []; S.recording = false;
  return u.label;
}

function hasRelic(k) { return !!(S && S.relics && S.relics.includes(k)); }
function toggleKeep(id) {
  if (S.keepMark === id) { S.keepMark = S.keepMark2 || null; S.keepMark2 = null; return; }
  if (S.keepMark2 === id) { S.keepMark2 = null; return; }
  if (S.keepMark == null) { S.keepMark = id; return; }
  if (hasRelic('pouch') && S.keepMark2 == null) { S.keepMark2 = id; return; }
  if (hasRelic('pouch')) { S.keepMark = S.keepMark2; S.keepMark2 = id; return; }
  S.keepMark = id;
}
function supplyMax() { return hasRelic('pack') ? 20 : 15; }
function relOf(a, b) {
  const r = (S && S.rels || []).find(x => (x.a === a && x.b === b) || (x.a === b && x.b === a));
  if (!r) return null;
  if (r.type === 'crush') return r.a === a ? 'crushTo' : 'crushFrom';
  return r.type;
}
function boardPartners(u, type) {

}

function hasTsun(...ids) { return ids.some(id => { const c = compById(id); return c && kwsOf(c).includes('tsun'); }); }
function ultReady(u) { if (!u || !u.comp) return false; const c = compById(u.comp); return bondLevel(c) >= 2 && !S.ultUsed[u.comp] && (u.resolve || 0) >= 3; }
function canCharge(u) { if (!u || !u.comp) return false; const c = compById(u.comp); return bondLevel(c) >= 2 && !S.ultUsed[u.comp]; }

function bondThresholds(c) { const add = kwsOf(c).includes('kuu') ? 2 : 0; return [3 + add, 6 + add, 10 + add]; }
function bondLevel(c) { const t = bondThresholds(c); return c.bondPts >= t[2] ? 3 : c.bondPts >= t[1] ? 2 : c.bondPts >= t[0] ? 1 : 0; }
function gainBond(c, n, why) {
  if (c.merc) return;
  if (kwsOf(c).includes('indiff')) {
    c.bondHalf = (c.bondHalf || 0) + n;
    n = Math.floor(c.bondHalf / 2); c.bondHalf %= 2;

  if (n <= 0) { log(`${c.name}: 유대 점수가 반영되지 않았습니다(무심)`, 'sys'); return; }
  const before = bondLevel(c);
  c.bondPts += n;
  log(`${c.name} 유대 +${n}(${why})`, 'good');
  if (bondLevel(c) > before) log(`${c.name} 유대 ${bondLevel(c)}단계 달성`, 'good');
}

  const set = linesFor(c, kind);

  const t = set[Math.floor(lrng() * set.length)].replace(/\{이름\}/g, c.name).replace(/\{상대\}/g, other || S.pro.name);
  log(`${c.name}: “${t}”`, 'line');
}

function compCardStats(c) {
  let [atk, hp] = ROLES[c.role].stats;
  if (bondLevel(c) >= 3) { atk++; hp++; }
  const k = kwsOf(c);
  if (k.includes('timid')) hp += 1;
  if (k.includes('devote')) hp -= 1;
  if (k.includes('compet')) hp -= 1;
  if (k.includes('dream')) atk -= 1;
  atk += c.atkMod || 0;
  const cost = {};
  const e1 = KEYWORDS[c.core].emo, e2 = KEYWORDS[c.aux[0]].emo;
  cost[e1] = (cost[e1] || 0) + 1; cost[e2] = (cost[e2] || 0) + 1;
  return { atk: Math.max(0, atk), hp: Math.max(1, hp), cost, sig: [c.sigil] };
}

/* ================= 토큰 ================= */
function fearCount() { return RULE.baseFear + ((S.diff || 0) >= 3 ? 1 : 0) + Math.floor(S.stress / (hasRelic('candle') ? 35 : 25)) + (S.effects.fear3 ? 3 : 0) + S.bossFear; }
function buildPool() {
  const bag = [];
  for (const card of S.master) {
    if (card.comp) {
      const c = compById(card.comp); if (c.status === 'dead') continue;
      bag.push(KEYWORDS[c.core].emo, KEYWORDS[c.aux[0]].emo);
    } else bag.push(...cardEmos(card));
  }
  for (const c of S.comps) if (c.status !== 'dead' && bondLevel(c) >= 2) bag.push('bond');
  for (let i = 0; i < S.mournCount; i++) bag.push('mourn');
  const f = fearCount();
  for (let i = 0; i < f; i++) bag.push('fear');
  return shuffle(bag);
}

function startTurn() {
  UNDO = [];
  S.turn++;
  const rage = S.front >= S.frontPush;
  if (rage && !S.enemyRage && S.turn > 1) log('적이 궁지에 몰려 발악합니다. 이번 턴부터 적 공격 +1', 'bad');
  S.enemyRage = rage;
  S.actionTaken = false; S.extraCount = 0; S.extraIds = []; S.exchangeUsed = false;
  S.momentum = false; S.counterBuff = false; S.phaseBreak = false;
  S.p.forEach(u => { if (u) u.tempAtk = 0; });
  if (S.cmdCd > 0) S.cmdCd--;
  S.bag = buildPool();
  S.tokens = [];
  const core = KEYWORDS[S.pro.core].emo;
  const g = S.effects.noSig ? 0 : S.effects.sig2 ? 2 : 1;
  for (let i = 0; i < g; i++) S.tokens.push(mkTok(core));
  for (let i = 0; i < RULE.randomDraw && S.bag.length; i++) S.tokens.push(mkTok(S.bag.pop()));
  S.kept.forEach(t => S.tokens.push(mkTok(t)));
  S.kept = [];
  drawCard();
}

function canExtra() { return !S.over && !S.actionTaken && S.extraCount < 3 && S.bag.length > 0; }
function extraDraw() {
  if (!canExtra()) return { ok: false };
  UNDO = [];
  const t = S.bag.pop();
  S.extraCount++;
  if (t === 'fear') {
    if (partyHas('naive') && S.extraCount === 1) { log('공포가 나왔지만 천진 덕분에 그 토큰만 버립니다', 'good'); return { ok: true, fear: true, saved: true }; }
    if (S.effects.bustImmune && !S.bustImmuneUsed) { S.bustImmuneUsed = true; log('공포가 나왔지만 각성 효과로 버스트를 면합니다', 'good'); return { ok: true, fear: true, saved: true }; }
    if (hasRelic('charm') && !S.charmUsed) { S.charmUsed = true; log('금 간 부적이 버스트를 막아 줍니다', 'good'); return { ok: true, fear: true, saved: true }; }
    let keepId = null;
    if (partyHas('cool') && S.extraIds.length) { keepId = S.extraIds[0]; }
    const lost = S.extraIds.filter(id => id !== keepId);
    S.tokens = S.tokens.filter(tk => !lost.includes(tk.id));
    if (lost.includes(S.keepMark)) S.keepMark = null;
    if (lost.includes(S.keepMark2)) S.keepMark2 = null;
    S.extraCount = 3;
    log(`버스트! 추가로 뽑은 토큰 ${lost.length}개를 잃었습니다${keepId ? '(냉철로 1개 보존)' : ''}`, 'bad');
    addStress((hasRelic('handmirror') ? 2 : 5) + (partyHas('hot') ? 3 : 0), '버스트');
    return { ok: true, fear: true, bust: true };
  }

function tryPay(cost, toks) {
  const used = []; const pool = toks.slice();
  const take = pred => { const i = pool.findIndex(pred); if (i < 0) return false; used.push(pool[i].id); pool.splice(i, 1); return true; };
  let wild = 0;
  for (const [e, n] of Object.entries(cost)) {
    for (let k = 0; k < n; k++) {
      if (take(t => t.t === e)) continue;
      if (e === 'fear') return null;
      wild++;
    }
  }
  for (let k = 0; k < wild; k++) {
    if (take(t => t.t === 'bond')) continue;
    if (take(t => t.t === 'mourn')) continue;
    return null;
  }
  return used;
}
function findPayment(cost) {
  const r = tryPay(cost, S.tokens.filter(t => t.id !== S.keepMark && t.id !== S.keepMark2));
  return r || tryPay(cost, S.tokens);
}

function exchange(tokId, emo) {

  if (!tok) return { ok: false, msg: '토큰을 찾을 수 없습니다' };
  pushUndo({ label: '보급 교환' });

  if (free) S.calcUsed = true; else S.supply--;
  tok.t = emo; S.exchangeUsed = true; S.actionTaken = true;

  log(`보급 1로 ${EMO[from]} 토큰을 ${jo(EMO[emo], '으로', '로')} 바꿨습니다`, 'sys');
  return { ok: true };
}

/* ================= 카드 ================= */
function drawCard(initial) {
  if (!S.deck.length) {
    if (!S.discard.length) return false;
    S.deck = shuffle(S.discard); S.discard = [];
    log('덱이 비어 버린 더미를 섞었습니다', 'bad');
    if (!initial) addStress(3, '덱 재셔플');
  }
  S.hand.push(S.deck.pop());
  return true;
}

function playCard(hi, lane) {
  if (S.over) return { ok: false };
  if (S.p[lane]) return { ok: false, msg: '이미 카드가 있는 칸입니다' };
  const card = S.hand[hi]; if (!card) return { ok: false };
  const info = cardInfo(card);
  const pay = findPayment(info.cost);
  if (!pay) return { ok: false, msg: '토큰이 부족합니다' };
  pushUndo({ label: `${info.name} 내기`, lane });
  const brokeBefore = S.brokeOnce;
  const used = S.tokens.filter(t => pay.includes(t.id));
  S.tokens = S.tokens.filter(t => !pay.includes(t.id));
  if (pay.includes(S.keepMark)) S.keepMark = null;
  if (pay.includes(S.keepMark2)) S.keepMark2 = null;
  S.hand.splice(hi, 1);
  let bonus = 0;
  if (info.comp && used.some(t => t.t === 'bond')) {
    const c = compById(info.comp);
    if (!kwsOf(c).includes('cool')) bonus += 1;
    say(c, 'play');
  } else if (info.comp) say(compById(info.comp), 'play', 0.35);
  S.p[lane] = mkUnit(card, info, bonus);
  S.p[lane].newTurn = S.turn;
  if (info.comp) {
    const c = compById(info.comp); const pl = proLink(c.id);
    if (pl === 'comrade') { S.kept.push(KEYWORDS[c.core].emo); log(`${c.name}: 든든한 동료. ${EMO[KEYWORDS[c.core].emo]} 토큰을 보관함에 받습니다`, 'good'); }
    if ((pl || bondLevel(c) >= 1) && !(S.cutinSeen = S.cutinSeen || {})[c.id]) {
      S.cutinSeen[c.id] = true;
      const set = linesFor(c, 'play');
      S.cutin = { id: c.id, name: c.name, link: pl, bond: bondLevel(c), line: set.length ? set[Math.floor(lrng() * set.length)].replace(/\{상대\}/g, S.pro.name).replace(/\{이름\}/g, c.name) : '' };
    }
  }
  UNDO[UNDO.length - 1].uid = S.p[lane].uid;
  S.actionTaken = true;
  log(`${jo(info.name, '을', '를')} ${lane + 1}번 레인에 냈습니다`, 'sys');
  const mourn = used.filter(t => t.t === 'mourn').length;
  if (mourn) { S.p[lane].bonus += 1; addStress(mourn * (3 + (partyHas('naive') ? 3 : 0)), '추모 토큰'); }
  if (!brokeBefore && S.brokeOnce) UNDO = [];

/* ================= 전투 계산 ================= */
function effAtk(u, side, lane, why) {
  // v0.27: why 배열을 넘기면 공격 증감 원인을 [이름, 수치]로 모읍니다 (계산은 그대로)
  let a = u.atk;
  const add = (n, nm) => { if (!n) return; a += n; if (why) why.push([nm, n]); };
  add(u.tempAtk || 0, '이번 턴 강화'); add(u.bonus || 0, '추모·관계 변화');
  const row = side === 'p' ? S.p : S.e;
  const kws = unitKws(u);
  if (!kws.includes('proud')) {
    const nb = [lane - 1, lane + 1].filter(n => n >= 0 && n < 4).map(n => row[n]).filter(v => v && v.hp > 0);
    add(nb.filter(v => v.sig.includes('cheer')).length, '옆 칸 격려');
    if (u.sig.includes('bondS')) add(Math.min(2, nb.length), '결속');
    if (u.comp) add(nb.filter(v => v.sig.includes('bondS')).length, '옆 칸 결속');
  }
  if (side === 'p') {
    if (S.counterBuff) add(1, '반격');
    if (kws.includes('hot') && S.front <= -S.frontPush) add(1, '열혈');
    if (kws.includes('proud') && S.front >= S.frontPush) add(1, '오만');
    if (kws.includes('timid') && S.front <= -S.frontPush) add(-1, '소심');
    if (u.comp) {
      if (boardPartners(u, 'crushTo').length) add(1 + (hasTsun(u.comp) ? 1 : 0), '잘 보이고 싶어');
      const pl = proLink(u.comp); if (pl === 'lover' || pl === 'crush') add(1, PRO_LINKS[pl].name);
      if (S.crushRage[u.comp]) add(2, '짝사랑 분노');
      if (kws.includes('obsess') && obsessLonely(compById(u.comp))) add(-1, '집착');
      if (kws.includes('compet')) add(Math.min(2, u.kills || 0), '승부욕');
      if (kws.includes('rebel')) add(S.stress >= 50 ? 2 : -1, '반항');
      if (kws.includes('perfect') && u.hp >= u.maxHp) add(1, '완벽주의');
    }
  } else if (S.enemyRage) add(1, '적 분노');
  return Math.max(0, a);
}

function damageUnit(u, amt, side, lane, noCover) {
  if (side === 'p') {
    if (!noCover && amt > 0 && hasRelic('cloak') && rng() < 0.10) {
      log(`낡은 망토: ${jo(u.name, '이', '가')} 공격을 피했습니다`, 'good');
      rec('dodge', { lane, name: u.name });
      return;
    }
    if (!noCover) amt = Math.max(0, amt - (u.wall || 0) - (S.ultShield ? 1 : 0));
    if (amt > 1 && u.sig.includes('armor')) amt -= 1;
    if (!noCover && amt > 0 && !unitKws(u).includes('devote')) {
      for (const n of [lane - 1, lane + 1]) {
        const v = S.p[n];
        if (v && v.hp > 0 && unitKws(v).includes('devote')) { v.hp -= 1; amt -= 1; log(`${jo(v.name, '이', '가')} 헌신으로 피해 1을 대신 받습니다`, 'sys'); break; }
      }
    }
    if (amt > 0 && u.comp && amt >= u.hp) {
      if (!noCover) {
        for (const pt of boardPartners(u, 'lover')) {
          const p = 0.30 + (hasTsun(u.comp, pt.u.comp) ? 0.10 : 0) + (hasRelic('ribbon') ? 0.10 : 0);
          if (rng() < p) {
            log(`감싸기! ${jo(pt.u.name, '이', '가')} ${u.name} 대신 공격을 맞습니다`, 'good');
            rec('joint', { kind: 'lover', lanes: [lane, pt.l], text: `감싸기: ${pt.u.name} → ${u.name}` });
            damageUnit(pt.u, amt, 'p', pt.l, true);
            return;
          }
        }
      }
      const c = compById(u.comp);
      if (!S.gritUsed[u.comp] && rng() < gritChance(c)) {
        S.gritUsed[u.comp] = true;
        u.hp = 1;
        log(`근성! ${jo(u.name, '이', '가')} 체력 1로 버팁니다`, 'good');
        rec('grit', { lane, name: u.name });
        addResolve(u);
        return;
      }
    }
    if (amt > 0) addResolve(u);
  }
  u.hp -= amt;
}

function hitFront(side, a, aLane, name, att) {
  if (a <= 0) return;
  if (side === 'p') {
    if (S.momentum) a += 1;
    S.front += a;
    log(`전선 +${a} → ${S.front > 0 ? '+' : ''}${S.front}`, 'good');
    rec('front', { side, a, aLane, name });
  } else {
    if (S.holdFront) { log(`버티기로 전선 피해 ${jo(a, '을', '를')} 막았습니다`, 'good'); rec('hold', { side, a, aLane, name }); return; }
    S.front -= a;
    log(`전선 −${a} → ${S.front > 0 ? '+' : ''}${S.front}`, 'bad');
    rec('front', { side, a, aLane, name });
    const st = a * RULE.frontStress + (att && att.sig.includes('threat') ? RULE.threatStress : 0);
    addStress(st, att && att.sig.includes('threat') ? '위협, 전선 밀림' : '전선 밀림');
  }
}

function strike(att, side, aLane, t, a) {
  const defSide = side === 'p' ? 'e' : 'p';
  const defRow = side === 'p' ? S.e : S.p;
  let d = defRow[t]; if (d && d.hp <= 0) d = null;
  const flying = att.sig.includes('fly');
  if (flying && !(d && d.sig.includes('watch'))) { hitFront(side, a, aLane, att.name, att); return; }
  if (!d) {
    for (const g of [t - 1, t + 1]) {
      if (g < 0 || g > 3) continue;
      const gu = defRow[g];
      if (gu && gu.hp > 0 && gu.sig.includes('guard')) { defRow[t] = gu; defRow[g] = null; d = gu; log(`${jo(gu.name, '이', '가')} 수호로 ${t + 1}번 레인을 막아섭니다`, 'sys'); rec('guard', { side: defSide, from: g, to: t, name: gu.name }); break; }
    }
  }
  if (!d) { hitFront(side, a, aLane, att.name, att); return; }
  if (att.sig.includes('execute') && d.hp < d.maxHp) { a += 2; log(`처단! ${jo(att.name, '이', '가')} 상처 입은 ${d.name}에게 피해 +2`, 'good'); }
  const before = d.hp;
  damageUnit(d, a, defSide, t);
  rec('hit', { side, aLane, t, dmg: before - d.hp, att: att.name, def: d.name });
  if (side === 'p' && att.comp && d.hp > 0) {
    for (const pt of boardPartners(att, 'comrade')) {
      if (d.hp <= 0) break;
      const p = 0.40 + (hasTsun(att.comp, pt.u.comp) ? 0.10 : 0) + (hasRelic('ribbon') ? 0.10 : 0);
      if (rng() < p) { d.hp -= 1; log(`연계! ${jo(pt.u.name, '이', '가')} ${d.name}에게 1 추가 피해`, 'good'); rec('joint', { kind: 'comrade', lanes: [pt.l], text: `연계: ${pt.u.name} → ${d.name} 1 추가 피해`, target: t }); }
    }
  }
  if (d.sig.includes('thorn')) { const hb = att.hp; damageUnit(att, 1, side, aLane); rec('thorn', { side, aLane, dmg: hb - att.hp, name: att.name }); }
  if (d.hp > 0 && att.sig.includes('poison')) d.poison = true;
  if (d.hp <= 0) {
    onKill(att, side);
    if (att.sig.includes('pierce') && a > before) hitFront(side, a - before, aLane, att.name, att);
  }
}

function onKill(att, side) {
  if (side !== 'p') return;
  if (!att.comp && att.card && att.card.cid) S.cardKills[att.card.cid] = (S.cardKills[att.card.cid] || 0) + 1;
  if (att.sig.includes('absorb')) absorbFx(att, laneOf(att));
  if (hasRelic('button') && rng() < 0.25 && S.supply < supplyMax()) { S.supply++; log('빛나는 단추: 보급 +1', 'good'); }
  if (att.comp) {
    att.kills = (att.kills || 0) + 1;
    S.kills[att.comp] = true; say(compById(att.comp), 'kill', 0.4);

    for (const pt of boardPartners(att, 'rival')) {
      const n = 1 + (hasTsun(att.comp, pt.u.comp) ? 1 : 0);
      pt.u.tempAtk += n;
      log(`경쟁심! ${jo(pt.u.name, '이', '가')} 이번 턴 공격 +${n}`, 'good');
      rec('joint', { kind: 'rival', lanes: [pt.l], text: `경쟁심: ${pt.u.name} 이번 턴 공격 +${n}` });

}

function attackPhase(side) {
  const row = side === 'p' ? S.p : S.e;
  for (let lane = 0; lane < 4; lane++) {
    if (S.over || S.phaseBreak) return;
    const u = row[lane];
    if (!u || u.hp <= 0) continue;
    if (side === 'p' && u.sig.includes('coward') && S.stress >= 50) continue;
    const a = effAtk(u, side, lane);
    if (a <= 0) continue;
    if (side === 'p') { addResolve(u); if (u.sig.includes('absorb')) absorbFx(u, lane); }
    const targets = u.sig.includes('split') ? [lane - 1, lane + 1].filter(n => n >= 0 && n < 4) : [lane];
    for (const t of targets) {
      strike(u, side, lane, t, a);
      if (S.over || S.phaseBreak || u.hp <= 0) break;
    }
    cleanup();
  }
}

function absorbFx(u, lane) {

}
function cleanup() {
  for (let l = 0; l < 4; l++) {

      rec('die', { side: 'p', lane: l, name: u.name });
      S.p[l] = null;
      if (u.sig.includes('echo')) { S.kept.push(u.emo); log(`${u.name}의 여운: ${EMO[u.emo]} 토큰을 보관합니다`, 'good'); }

/* 응급: 옆 칸 아군의 체력 +1(격려의 체력판). 붙고 떨어질 때마다 다시 계산합니다 */
function refreshMend() {
  if (!S) return;
  S.p.forEach((u, l) => {
    if (!u || u.hp <= 0) return;
    let want = 0;
    for (const n of [l - 1, l + 1]) { const v = S.p[n]; if (v && v.hp > 0 && v.sig.includes('mend')) want++; }
    const had = u.mendB || 0;
    if (want !== had) { u.maxHp += want - had; u.hp = Math.max(1, u.hp + want - had); u.mendB = want; }
  });
}

/* ================= 동료, 스트레스 ================= */
function companionDown(u) {

  c.status = 'saseon';
  say(c, 'down');
  crushRageFor(c);
  log(`${jo(c.name, '이', '가')} 사선에 섰습니다. 한 번 더 쓰러지면 사망합니다`, 'bad');
  addStress((c.merc ? 5 : kwsOf(c).includes('timid') ? 5 : 10) + (kwsOf(c).includes('perfect') ? 5 : 0) + (kwsOf(c).includes('chatty') ? 5 : 0), '동료 사선');
}

function crushRageFor(c) {

      S.crushRage[o.id] = true;
      log(`${jo(o.name, '이', '가')} ${c.name}의 모습을 보고 격앙합니다. 이번 전투 공격 +2`, 'good');
    }
  }
}

    const revenge = kwsOf(o).includes('obsess') ? true : rng() < 0.5;
    o.atkMod = (o.atkMod || 0) + (revenge ? 1 : -1);
    const bu = S.p.find(u => u && u.comp === o.id);
    if (bu) bu.bonus += revenge ? 1 : -1;
    log(revenge ? `${jo(o.name, '이', '가')} 복수를 맹세합니다. 남은 런 동안 공격 +1` : `${jo(o.name, '은', '는')} 슬픔에 무너집니다. 남은 런 동안 공격 −1`, revenge ? 'good' : 'bad');
  }
}
function companionDie(c) {
  if (c.status === 'dead') return;
  const lvl = bondLevel(c);
  c.status = 'dead';
  say(c, 'death');
  const wit = S.comps.filter(o => o.status !== 'dead' && !o.merc);
  if (wit.length) say(wit[Math.floor(lrng() * wit.length)], 'witness', undefined, c.name);
  log(`${c.name} 사망. 토큰 2개가 추모 토큰으로 바뀝니다`, 'bad');

  if (partyHas('kind')) s += 5;
  if (hasRelic('ring')) s = Math.max(0, s - 10);

}

function addStress(n, why) {
  if (!n) return;
  const before = S.stress;
  S.stress = Math.max(0, Math.min(100, S.stress + n));
  const d = S.stress - before;
  if (d) log(`스트레스 ${d > 0 ? '+' : ''}${d}(${why}) → ${S.stress}`, d > 0 ? 'bad' : 'good');
  if (S.stress >= 100 && !S.over) {
    if (!S.brokeOnce) { S.brokeOnce = true; breakRoll(); S.stress = 60; }
    else { S.over = 'runover'; S.overReason = '정신력이 두 번째 한계에 도달해 주인공이 쓰러졌습니다'; log(S.overReason, 'bad'); }
  }
}

const BREAK_TEXT = {

/* ================= 턴 진행 ================= */
function fillTele() {
  let list;

  else { let n = rng() < 0.4 + 0.03 * ((S.floor || 1) - 1) ? 2 : 1;
    // v0.27: 보스전은 정해진 증원이 끝나면 한 번에 1마리만, 적(예고 포함)이 5마리 이상이면 쉬어 갑니다

}

function enemyTurn() {

  S.phaseBreak = false;

  const dl = [];

    const t = S.tele[l];
    if (t && !S.e[l]) { if (t.delay > 0) { t.delay--; continue; } S.e[l] = t; S.tele[l] = null; dl.push(l); }
  }
  if (dl.length) rec('descend', { lanes: dl });

  [['p', S.p], ['e', S.e]].forEach(([sd, row]) => row.forEach((u, l) => { if (u && u.poison) { u.hp -= 1; pl[sd].push(l); } }));
  if (pl.p.length || pl.e.length) rec('poison', { lanes: pl });

  for (let l = 0; l < 4; l++) {
    const u = S.p[l]; if (!u || !u.comp) continue;
    for (const pt of boardPartners(u, 'family')) {

      const key = [u.uid, pt.u.uid].sort().join('-'); if (healed.has(key)) continue; healed.add(key);

  S.p.forEach(u => { if (u) u.wall = 0; });
  S.holdFront = false;
}

function canFuseUI(c) { return !c.custom; }

/* ---------- 런 시작 ---------- */
function buildRun(mode) {
  fixSetup();
  const P = charById(SETUP.pro); if (!P) return null;
  const toComp = key => {
    const ch = charById(SETUP[key]); if (!ch) return null;
    return { id: ch.id, name: ch.name, role: ch.role, core: ch.core, aux: ch.aux.slice(), sigil: ch.sigil, speech: ch.speech, lines: { ...ch.lines }, ultName: ch.ultName || '',
      status: SETUP[key + 'st'], bondPts: bondPtsForLevel(ch, +SETUP[key + 'bond']) };
  };
  const comps = [toComp('c1'), toComp('c2')].filter(Boolean);
  const ids = [P.id, ...comps.map(c => c.id)];
  const bench = ROSTER.chars.filter(c => !ids.includes(c.id)).map(ch => ({ id: ch.id, name: ch.name, role: ch.role, core: ch.core, aux: ch.aux.slice(), sigil: ch.sigil, speech: ch.speech, lines: { ...ch.lines }, ultName: ch.ultName || '' }));
  return newRun({ mode, pro: { id: P.id, name: P.name, role: P.role, cmd: P.cmd, core: P.core, aux: P.aux.slice(), speech: P.speech, lines: { ...P.lines } },
    comps, stress: +SETUP.stress, supply: +SETUP.supply, bench,
    rels: ROSTER.rels.filter(x => ROSTER.chars.some(c => c.id === x.a) && ROSTER.chars.some(c => c.id === x.b)) });
}
function startMapRun() {
  RUN = buildRun('map'); if (!RUN) return;
  RUN.map = genMap();

/* ---------- 입력 ---------- */
function onRunAct(act, d) {
  switch (act) {
    case 'start-map': startMapRun(); return true;
    case 'new-map-run': if (RUN && RUN.fromPrep) startGameRun(); else startMapRun(); return true;
    case 'relic-info': flash(`${RELICS[d.k].name}: ${RELICS[d.k].desc}`); return true;
    case 'card-info': UI.cinfo = { ctx: d.ctx, k: d.k, i: d.i !== undefined ? +d.i : undefined, cid: d.cid }; render(); return true;
    case 'close-cinfo': UI.cinfo = null; render(); return true;
    case 'legacy-sel': RUN.legacySel = RUN.legacySel === d.cid ? null : d.cid; render(); return true;
    case 'legacy-confirm': { const r = leaveLegacy(RUN, RUN.legacySel); if (!r.ok) flash(r.msg); render(); return true; }
    case 'reveal-next': fadeReveal(() => { UI.revealQ.shift(); render(); }); return true;
    case 'show-deck': UI.deckOpen = true; UI.picking = null; UI.fuseSel = []; render(); return true;
    case 'close-deck': UI.deckOpen = false; UI.picking = null; UI.fuseSel = []; render(); return true;
    case 'node': {
      const res = moveTo(RUN, +d.id);
      if (!res.ok) { flash(res.msg); return true; }
      UI.mapScrolled = false;
      if (RUN.over) { screen = 'runend'; render(); return true; }
      const n = res.node;
      if (res.msg) UI.pendingToast = res.msg;
      if (n.type === 'battle' || n.type === 'elite' || n.type === 'boss') startRunBattle(encFor(n, RUN.stage));
      else if (n.type === 'event' || n.type === 'legacy') { startEvent(RUN, n); screen = 'event'; render(); }
      else if (n.type === 'camp') { RUN.camped = false; RUN.lastCamp = null; RUN.fused = false; RUN.lastFuse = null; screen = 'camp'; render(); }
      else if (n.type === 'trade') { makeShop(RUN); screen = 'trade'; render(); }
      window.scrollTo(0, 0);
      if (UI.pendingToast) { const t = UI.pendingToast; UI.pendingToast = null; flash(t); }
      return true;
    }
    case 'ev-choose': { const had = deckCids(); const r = chooseEvent(RUN, +d.i); if (!r.ok && r.msg) flash(r.msg); if (RUN.over) { screen = 'runend'; } else gainReveal(had); render(); return true; }
    case 'to-map': UI.deckOpen = false; screen = RUN.over ? 'runend' : RUN.stageDone ? 'stage' : 'map'; render(); window.scrollTo(0, 0); return true;
    case 'next-stage': { const r = advanceStage(RUN); if (!r.ok) return true; placeLegacy(RUN); UI.mapScrolled = false; screen = 'map'; render(); window.scrollTo(0, 0); flash(r.text); return true; }
    case 'buy-card': { const had = deckCids(); const r = buyCard(RUN, +d.i); UI.cinfo = null; if (!r.ok) flash(r.msg); else { gainReveal(had); render(); } return true; }
    case 'buy-relic': { const r = buyRelic(RUN); if (!r.ok) flash(r.msg); else render(); return true; }
    case 'pick-remove': UI.deckOpen = true; UI.picking = 'remove'; render(); return true;
    case 'pick-fuse': UI.deckOpen = true; UI.picking = 'fuse'; UI.fuseSel = []; render(); return true;
    case 'pick-card': {
      if (UI.picking === 'remove') { const r = removeCard(RUN, d.cid); UI.deckOpen = false; UI.picking = null; UI.cinfo = null; if (!r.ok) flash(r.msg); else flash(`${jo(r.name, '을', '를')} 덱에서 뺐습니다`); return true; }
      if (UI.picking === 'fuse') {
        const s = UI.fuseSel || (UI.fuseSel = []);
        const i = s.indexOf(d.cid);
        if (i >= 0) s.splice(i, 1); else if (s.length < 2) s.push(d.cid);
        render(); return true;
      }
      return true;
    }
    case 'confirm-fuse': {
      const [a, b] = UI.fuseSel; const ca = { ...RUN.deck.find(c => c.cid === a) }, cb = { ...RUN.deck.find(c => c.cid === b) };
      const r = campFuse(RUN, a, b); UI.deckOpen = false; UI.picking = null; UI.fuseSel = [];
      if (!r.ok) { flash(r.msg); return true; }
      UI.revealQ = [{ kind: 'fuse', from: [ca, cb], card: r.card, title: '엮기 완료', sub: fixJosa(`${cardInfo(r.card).name}이(가) 태어났습니다`) }];
      render(); return true;
    }
    case 'take-card': { takeRewardCard(RUN, d.k); UI.cinfo = null; render(); return true; }
    case 'skip-card': { skipRewardCard(RUN); render(); return true; }
    case 'to-reward': {
      syncOnce();
      if (RUN.over) { screen = 'runend'; render(); return true; }
      if (S.enc.boss && (RUN.stage || 1) >= MAX_STAGE) { RUN.cleared = true; UI.endPage = 0; screen = RUN.fromPrep ? 'ending' : 'runend'; render(); window.scrollTo(0, 0); return true; }
      if (S.enc.boss) RUN.stageDone = true;
      makeReward(RUN, S);
      UI.revealQ = (RUN.awakened || []).map(cid => { const c = RUN.deck.find(x => x.cid === cid); return c && { kind: 'awaken', card: c, title: '각성!', sub: fixJosa(`${cardInfo(c).name.replace('각성한 ', '')}이(가) 세 번의 처치 끝에 각성했습니다`) }; }).filter(Boolean);
      screen = 'reward'; render(); window.scrollTo(0, 0); return true;
    }
    case 'back-map': syncOnce(); screen = RUN.over ? 'runend' : 'map'; render(); window.scrollTo(0, 0); return true;
    case 'to-runend': syncOnce(); screen = 'runend'; render(); return true;
  }
  return false;
}
'use strict';
/* ================= 게임 화면: 타이틀, 출정 준비, 이어하기 ================= */
const GAME_TITLE = '탑으로 가는 길';

/* ---------- 저장 ---------- */
function loadRunState() {

}

}
function resumeRun() {

function sigText(sig) { return sig.map(s => SIGILS[s].name).join(' '); }

    if (fx.type === 'poison' && fx.lanes[side] && fx.lanes[side].includes(lane)) { cls.push('fx-hit'); pop = '<span class="pop">−1</span>'; }
    if (fx.type === 'joint' && side === 'p' && fx.lanes.includes(lane)) { cls.push('fx-joint'); }
    if (fx.type === 'joint' && fx.kind === 'comrade' && side === 'e' && fx.target === lane) { cls.push('fx-hit'); pop = '<span class="pop">−1</span>'; }
    if (fx.type === 'grit' && side === 'p' && fx.lane === lane) { cls.push('fx-joint'); pop = '<span class="pop good">근성!</span>'; }
    if (fx.type === 'absorb' && side === 'p' && fx.lane === lane) { cls.push('fx-buff'); pop = `<span class="pop good">스트레스 −${fx.n}</span>`; }

  if (u.poison) badges.push('<em class="bd bad">독</em>');

  if (info.desperate) parts.push('<div class="soft">절박 카드: 공포 토큰으로만 낼 수 있는 비용이 들어 있습니다.</div>');
  if (info.comp) {
    const c = compById(info.comp);
    parts.push(c.merc ? '<div class="soft">떠돌이 용병: 관계, 궁극기, 유대가 없습니다. 유대 토큰으로 내도 보너스는 없습니다.</div>' : `<div class="soft">키워드: ${kwsOf(c).map(k => KEYWORDS[k].name).join(', ')}. 유대 토큰으로 내면 이번 전투 공격 +1${kwsOf(c).includes('cool') ? '(냉철이라 보너스 없음)' : ''}.</div>`);
    if (c.status === 'saseon') parts.push('<div class="warn">사선 상태입니다. 이번에 쓰러지면 사망합니다.</div>');
  }
  if (!findPayment(info.cost)) parts.push('<div class="warn">지금 가진 토큰으로는 낼 수 없습니다.</div>');
  else parts.push('<div class="soft">놓을 빈 칸을 누르세요.</div>');
  return parts.join('');
}
const CAPTION = {
  hit: f => f.side === 'p' ? `${f.att} → ${f.def}, 피해 ${f.dmg}` : `적 ${f.att} → ${f.def}, 피해 ${f.dmg}`,
  front: f => f.side === 'p' ? `${f.name}: 전선 +${f.a}` : `적 ${f.name}: 전선 −${f.a}`,
  hold: f => `버티기: 적 ${f.name}의 전선 피해 ${f.a}을 막음`,
  thorn: f => `가시: ${f.name} 피해 ${f.dmg}`,
  die: f => f.side === 'p' ? `${f.name} 쓰러짐` : `적 ${f.name} 처치`,
  descend: () => '예고된 적이 내려옵니다',
  guard: f => `${f.name}: 수호로 ${f.to + 1}번 레인을 막아섬`,
  poison: () => '독: 체력 1 감소',
  phase: () => S.enc.phaseCap || '2페이즈 시작',
  joint: f => f.text,
  grit: f => `근성: ${f.name} 체력 1로 버팀`,
  absorb: f => `흡수: ${f.name}, 스트레스 −${f.n}`,
};
function hintHtml() {
  if (UI.playing && UI.fx) return `<b class="caption">${esc(CAPTION[UI.fx.type](UI.fx))}</b>`;
  if (UI.info) return UI.info;
  if (UI.mode === 'exchange') return UI.exTok ? '바꿀 감정을 고르세요.' : '보급 1로 바꿀 토큰을 누르세요.';
  if (UI.mode === 'cmd') {
    const t = COMMANDS[S.pro.cmd].target;
    return { ally: '대상 아군 카드를 누르세요.', enemy: '대상 적 카드를 누르세요.', tele: '늦출 예고 카드를 누르세요.', token: UI.exTok ? '바꿀 감정을 고르세요.' : '바꿀 토큰을 누르세요.', shift: UI.from == null ? '옮길 아군 카드를 누르세요.' : '옮겨 갈 빈 칸을 누르세요.' }[t];
  }
  if (S.turn === 1 && !S.actionTaken) return '손패에서 카드를 골라 빈 칸에 내세요. 토큰을 누르면 다음 턴으로 넘길 보관 토큰이 됩니다. 한 번 더는 카드를 내기 전에만 쓸 수 있습니다.';
  return '카드나 보드를 누르면 설명이 나옵니다.';
}

function logHtml() {
  const items = S.log.slice(-14).reverse().map(l => `<li class="lg ${l.kind}"><span class="lt">${l.turn || "–"}</span>${esc(l.text)}</li>`).join('');
  return `<details class="log"${UI.logOpen ? ' open' : ''}><summary>전투 기록</summary><ol>${items}</ol></details>`;
}

function overlayHtml() {
  if ((UI.mode === 'exchange' || (UI.mode === 'cmd' && COMMANDS[S.pro.cmd].target === 'token')) && UI.exTok) {
    return `<div class="sheet"><div class="sheet-body"><p>어떤 감정으로 바꿀까요? ${UI.mode === 'cmd' ? `지휘: ${esc(COMMANDS[S.pro.cmd].name)}` : '보급 1을 씁니다.'}</p>
      <div class="emo-pick">${BASIC.map(e => `<button class="tok t-${e}" data-emo="${e}">${EMO[e]}</button>`).join('')}</div>
      <button class="btn ghost" data-act="cancel">취소</button></div></div>`;
  }
  if (!S.over || UI.playing) return '';
  const mapMode = RUN && RUN.mode === 'map';
  const again = mapMode
    ? (S.over === 'runover' ? '<div class="res-btns col"><button class="btn primary" data-act="to-runend">런 결과 보기</button></div>'
      : S.over === 'win' ? `<div class="res-btns col"><button class="btn primary" data-act="to-reward">${S.enc.boss ? '스테이지 돌파' : '전리품 받기'}</button></div>`
      : S.enc.boss ? '<div class="res-btns col"><button class="btn primary" data-act="to-runend">런 결과 보기</button></div>'
      : '<div class="res-btns col"><button class="btn primary" data-act="back-map">맵으로</button></div>')
    : S.over === 'runover'
    ? '<div class="res-btns"><button class="btn primary" data-act="again">같은 파티로 새 런</button><button class="btn" data-act="setup">설정 바꾸기</button></div>'
    : '<div class="res-btns col"><button class="btn primary" data-act="to-camp">야영하기</button><button class="btn" data-act="next-battle">야영 없이 다음 전투</button><button class="btn ghost" data-act="setup">런 그만두기</button></div>';
  if (S.over === 'lose') {
    const alive = S.comps.filter(c => c.status !== 'dead');
    return `<div class="sheet"><div class="sheet-body"><h2>전선이 무너졌습니다</h2>
      <p>동료 한 명을 남겨 두고 후퇴할 수 있습니다. 남긴 동료는 이번 런에서 사망합니다.</p>
      <div class="sac">${alive.map(c => `<button class="btn" data-sac="${c.id}">${jo(esc(c.name), '을', '를')} 남기고 후퇴<small>${c.status === 'saseon' ? '사선' : '정상'}, 유대 ${bondLevel(c)}단계</small></button>`).join('')}</div>
      <button class="btn ghost" data-act="giveup">후퇴하지 않기(런 종료)</button></div></div>`;
  }
  const title = { win: '승리', retreated: '후퇴했습니다', runover: '런 종료' }[S.over];
  const lines = [];
  if (S.over === 'win') lines.push(`${S.turn}턴 만에 이겼습니다. 이 상대의 목표 길이는 ${S.enc.target}입니다.`);
  if (S.over === 'runover') lines.push(esc(S.overReason || ''));
  lines.push(`스트레스 ${S.stress}, 보급 ${S.supply}`);
  const cs = S.comps.map(c => `${esc(c.name)}: ${{ ok: '정상', saseon: '사선', dead: '사망' }[c.status]}, 유대 ${bondLevel(c)}단계`).join('<br>');
  return `<div class="sheet"><div class="sheet-body"><h2>${title}</h2><p>${lines.join('<br>')}</p><p class="soft">${cs}</p>${again}</div></div>`;
}

function renderBattle() {
  if (TUT) tutAdvance();
  const handEl = app.querySelector('.hand');
  const sx = handEl ? handEl.scrollLeft : 0;
  let bossBanner = S.enc.boss && S.turn === 1 && !S.actionTaken && !UI.bossSeen && S.phase === 1 ? `<div class="reveal boss" data-act="boss-ok"><div class="rv-rays" aria-hidden="true"></div><div class="rv-text"><small class="phase-tag">보스 · 페이즈 1/2</small><b>${esc(S.enc.name.replace('보스: ', ''))}</b><span>전선 게이지 ±${S.frontMax}. ${esc(S.enc.banner || '')}</span><small>눌러서 시작</small></div></div>` : '';
  if (S.enc.boss && S.phase === 2 && !UI.phase2Seen && !UI.playing && !S.over) {
    const bu = S.e.find(u => u && u.boss);
    bossBanner = `<div class="reveal boss phase2" data-act="phase-ok"><div class="rv-rays" aria-hidden="true"></div><div class="rv-text"><small class="phase-tag">페이즈 2/2 · 마지막 페이즈</small><b>${esc(bu ? bu.name : '보스')}</b>${bu ? `<span class="evo-stats">공격 ${bu.atk} · 체력 ${bu.hp}${bu.sig.length ? ` · ${esc(sigText(bu.sig))}` : ''}</span>` : ''}<span>${esc(S.enc.phase2Text || '')}</span><small>눌러서 계속</small></div></div>`;
  }
  app.innerHTML = `<main class="battle${UI.playing ? ' playing' : ''}${S.enc.boss ? ' boss-fight' : ''}">`
    + bossBanner + `
    <header class="top">${frontHtml()}${statusHtml()}</header>
    ${TUT ? tutGuideHtml() : ''}
    ${boardHtml()}
    ${tokensHtml()}
    <section class="info"><div class="info-row"><div>${hintHtml()}</div><button class="btn small-btn gloss-btn" data-act="gloss">용어</button></div></section>
    ${actionsHtml()}
    ${handHtml()}
    ${logHtml()}
    ${TUT && S.over ? tutOverlayHtml() : overlayHtml()}
    ${pileSheet()}${glossSheet()}
  </main>`;
  const h2 = app.querySelector('.hand');
  if (h2) h2.scrollLeft = sx;
  if (TUT) tutAfterRender();
  if (!TUT) ultNotice();
}

const SCREENS = { firstchar: () => renderFirstChar(), ending: () => renderEnding(), stage: () => renderStage(), title: () => renderTitle(), story: () => renderStory(), howto: () => renderHowTo(), base: () => renderBase(), prep: () => renderPrep(), setup: () => renderSetup(), roster: () => renderRoster(), edit: () => renderEditor(), camp: () => renderCamp(),
  map: () => renderMap(), event: () => renderEvent(), trade: () => renderTrade(), reward: () => renderReward(), runend: () => renderRunEnd() };
function render() {
  // 턴 재생 중에는 연출 타이머 등이 결과 화면을 끼워 그리지 않게 막습니다(재생이 끝나면 다시 그림)
  if (UI.playing && screen === 'battle') return;
  (SCREENS[screen] || renderBattle)();
  saveRunState();
  if (UI.lastScreen !== screen) {
    UI.lastScreen = screen;
    const m = app.querySelector('main');
    if (m && !REDUCED) { m.classList.add('screen-enter'); setTimeout(() => m.classList.remove('screen-enter'), 260); }
  }
}

function renderSnap(sn) {
  const bak = { p: S.p, e: S.e, tele: S.tele, front: S.front, stress: S.stress, turn: S.turn };
  Object.assign(S, sn);
  try { renderBattle(); } finally { Object.assign(S, bak); }
}
const FX_MS = { absorb: 520, hit: 560, front: 560, hold: 520, thorn: 420, die: 440, descend: 480, guard: 440, poison: 480, phase: 1000, joint: 700, grit: 800 };
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function playEvents() {
  const evs = S.events.slice(); S.events = [];
  if (!evs.length) { render(); return; }
  UI.playing = true; UI.skip = false;
  try {
    for (const ev of evs) {
      if (UI.skip) break;
      UI.fx = ev;
      renderSnap(ev.snap);
      await sleep(FX_MS[ev.type] * (REDUCED ? 0.6 : 1));
    }
  } finally {
    UI.playing = false; UI.fx = null;
    render();
  }
}

/* ---------- 입력 처리 ---------- */
function doCmd(tg) {
  const r = useCommand(tg);
  resetUI();
  if (!r.ok) { flash(r.msg); return; }
  const cm = COMMANDS[S.pro.cmd];
  const target = tg.lane !== undefined ? { side: cm.target === 'enemy' ? 'e' : cm.target === 'tele' ? 't' : 'p', lanes: [tg.lane] } : tg.to !== undefined ? { side: 'p', lanes: [tg.to] } : null;
  castFx('cmd', cm.name, cm.desc, { target });
  render();
}

function onSlot(side, lane) {
  if (S.over) return;
  if (UI.mode === 'play') {
    if (side !== 'p') { flash('아군 줄의 빈 칸에만 낼 수 있습니다'); return; }
    const r = playCard(UI.sel, lane);
    if (!r.ok) { flash(r.msg || '낼 수 없습니다'); return; }
    resetUI();
    if (S.cutin) { showFx('cutin', cutinHtml(S.cutin), 1800); S.cutin = null; }
    render(); return;
  }
  if (UI.mode === 'cmd') {
    const t = COMMANDS[S.pro.cmd].target;
    if (t === 'ally' && side === 'p') return doCmd({ lane });
    if (t === 'enemy' && side === 'e') return doCmd({ lane });
    if (t === 'tele' && side === 't') return doCmd({ lane });
    if (t === 'shift' && side === 'p') {
      if (UI.from == null) { if (S.p[lane]) { UI.from = lane; render(); } else flash('먼저 옮길 아군 카드를 누르세요'); return; }
      if (lane === UI.from) { UI.from = null; render(); return; }
      return doCmd({ from: UI.from, to: lane });
    }
    flash('이 지휘 스킬의 대상이 아닙니다'); return;
  }
  const u = side === 'p' ? S.p[lane] : side === 'e' ? S.e[lane] : S.tele[lane];
  if (u && UI.focus && UI.focus.side === side && UI.focus.lane === lane) { resetUI(); render(); return; }
  UI.info = u ? unitInfo(u, side, lane) : null;
  UI.focus = u ? { side, lane, range: rangeOf(u, side, lane) } : null;
  render();
}

function onTok(id) {
  if (S.over) return;
  if (UI.mode === 'exchange') { UI.exTok = id; render(); return; }
  if (UI.mode === 'cmd' && COMMANDS[S.pro.cmd].target === 'token') { UI.exTok = id; render(); return; }
  toggleKeep(id);
  render();
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-hand],[data-side],[data-tok],[data-emo],[data-sac]');
  if (el && !el.disabled && !tutAllow(el)) return;
  if (el && el.dataset.act && !el.disabled && (onGameAct(el.dataset.act, el.dataset) || onRunAct(el.dataset.act, el.dataset) || onMenuAct(el.dataset.act, el.dataset))) return;
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (UI.playing) { if (d.act === 'skip') UI.skip = true; return; }
  if (d.act) {
    switch (d.act) {
      case 'start': startBattle(); return;
      case 'again': startBattle(); return;
      case 'setup': screen = 'setup'; render(); return;
      case 'cancel': resetUI(); render(); return;
      case 'undo': { const lb = undo(); resetUI(); if (lb) flash(`되돌림: ${lb}`); else render(); return; }
      case 'extra': {
        const r = extraDraw();
        if (r.bust) flash('버스트! 추가로 뽑은 토큰을 잃었습니다');
        else if (r.saved) flash('공포가 나왔지만 버스트를 면했습니다');
        render(); return;
      }
      case 'exchange': resetUI(); UI.mode = 'exchange'; render(); return;
      case 'cmd': {
        const t = COMMANDS[S.pro.cmd].target;
        if (t === 'none') return doCmd({});
        resetUI(); UI.mode = 'cmd'; render(); return;
      }
      case 'crisis': {
        const k = ROLES[S.pro.role].crisis; const r = useCrisis(); resetUI();
        if (r.ok) castFx('crisis', CRISIS[k].name, CRISIS[k].desc, { target: k === 'counter' ? { side: 'p', lanes: [0, 1, 2, 3] } : null });
        render(); return;
      }
      case 'pile-info': UI.pileOpen = true; render(); return;
      case 'close-pile': UI.pileOpen = false; render(); return;
      case 'end': resetUI(); endTurn(); playEvents(); return;
      case 'giveup': giveUp(); render(); return;
      case 'ult': {
        const u = S.p[+d.lane]; const c = u && u.comp ? compById(u.comp) : null;
        const r = useUlt(+d.lane); resetUI();
        if (!r.ok) { flash(r.msg); return; }
        const line = [...S.log].reverse().find(l => l.kind === 'line');
        castFx('ult', c.ultName || ULTS[c.role].def, line ? line.text : ULTS[c.role].desc, { id: c.id, who: c.name, target: { side: c.role === 'atk' ? 'e' : 'p', lanes: c.role === 'atk' ? [+d.lane] : [0, 1, 2, 3] } });
        render(); return;
      }
    }
  }
  if (d.hand !== undefined) {
    const i = +d.hand;
    if (UI.mode === 'play' && UI.sel === i) { resetUI(); render(); return; }
    resetUI(); UI.mode = 'play'; UI.sel = i; UI.info = cardInfoHtml(S.hand[i]); render(); return;
  }
  if (d.side) { onSlot(d.side, +d.lane); return; }
  if (d.tok) { onTok(+d.tok); return; }
  if (d.emo && UI.mode === 'cmd') { doCmd({ tok: UI.exTok, emo: d.emo }); return; }
  if (d.emo) { const r = exchange(UI.exTok, d.emo); resetUI(); if (!r.ok) flash(r.msg); else render(); return; }
  if (d.sac) { sacrifice(d.sac); render(); }
});

function onMenuAct(act, d) {
  switch (act) {
    case 'to-roster': screen = 'roster'; render(); window.scrollTo(0, 0); return true;
    case 'boss-ok': fadeReveal(() => { UI.bossSeen = true; render(); }); return true;
    case 'phase-ok': fadeReveal(() => { UI.phase2Seen = true; render(); }); return true;
    case 'to-camp': syncOnce(); screen = 'camp'; resetUI(); render(); window.scrollTo(0, 0); return true;
    case 'next-battle': syncOnce(); startRunBattle(SETUP.enc); return true;
    case 'depart': startRunBattle(SETUP.enc); return true;
    case 'camp-rest': case 'camp-heal': case 'camp-talk': {
      const r = act === 'camp-rest' ? campRest(RUN) : act === 'camp-heal' ? campHeal(RUN, d.id) : campTalk(RUN, d.id);
      if (!r.ok) flash(r.msg); else render();
      return true;
    }
    case 'to-setup': screen = 'setup'; render(); window.scrollTo(0, 0); return true;
    case 'new-char': if (ROSTER.chars.length < rosterSlots()) openEditor(blankChar()); return true;
    case 'edit-char': openEditor(charById(d.id)); return true;
    case 'cancel-edit': screen = 'roster'; UI.draft = null; render(); return true;
    case 'save-char': saveDraft(); return true;
    case 'clear-portrait': UI.draft.portrait = null; render(); return true;
    case 'show-code': UI.showCode = !UI.showCode; render(); return true;
    case 'copy-code': {
      const ta = app.querySelector('textarea[data-f=codeout]');
      const done = () => flash('코드를 복사했습니다');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); flash('자동 복사가 막혀 있어요. 선택된 코드를 직접 복사하세요'); });
      else { ta.select(); flash('선택된 코드를 직접 복사하세요'); }
      return true;
    }
    case 'delete-char': {
      if (!UI.confirmDel) { UI.confirmDel = true; render(); return true; }
      const id = UI.draft.id;
      ROSTER.chars = ROSTER.chars.filter(c => c.id !== id);
      ROSTER.rels = ROSTER.rels.filter(r => r.a !== id && r.b !== id);
      saveRoster(); screen = 'roster'; UI.draft = null; flash('삭제했습니다'); return true;
    }
    case 'import-char': {
      const ch = parseCharCode(UI.importText);
      if (!ch) { flash('코드를 읽을 수 없습니다. 코드 전체를 붙여 넣었는지 확인하세요'); return true; }
      if (ROSTER.chars.length >= rosterSlots()) { flash('슬롯이 가득 찼습니다'); return true; }
      ch.id = newCharId(); ROSTER.chars.push(ch); saveRoster(); UI.importText = '';
      flash(`${jo(ch.name, '을', '를')} 불러왔습니다. 초상화는 편집에서 등록하세요`); return true;
    }
  }
  return false;
}

app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.p) { PREP[t.dataset.p] = t.value; UI.confirmNew = false; render(); return; }
  if (t.dataset.k) { SETUP[t.dataset.k] = t.value; render(); return; }
  if (screen === 'edit' && UI.draft) {
    const f = t.dataset.f;
    if (f === 'portrait' && t.files && t.files[0]) {
      readPortrait(t.files[0]).then(url => { UI.draft.portrait = url; render(); }, () => flash('이미지를 읽지 못했습니다'));
      return;
    }
    if (['role', 'cmd', 'sigil', 'core', 'speech'].includes(f)) { UI.draft[f] = t.value; render(); return; }
    if (f === 'aux0' || f === 'aux1') { UI.draft.aux[+f.slice(3)] = t.value; render(); return; }
    if (t.dataset.rel !== undefined) { UI.draftRels[t.dataset.rel] = t.value; return; }
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (screen === 'edit' && UI.draft) {
    if (t.dataset.f === 'ultName') UI.draft.ultName = t.value;
    if (t.dataset.f === 'name') { UI.draft.name = t.value; const b = app.querySelector('[data-act=save-char]'); if (b) { const v = draftValid(UI.draft); b.disabled = !v; b.textContent = v ? '저장' : '이름과 키워드를 확인하세요'; } }
    if (t.dataset.line) UI.draft.lines[t.dataset.line] = t.value;
  }
  if (t.dataset.f === 'import') UI.importText = t.value;
});
app.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.log')) UI.logOpen = e.target.open; }, true);

render();
</script>
</body>
</html>
