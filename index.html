/* ---------- 공격·방어 범위 ---------- */
function rangeWord(sig, atk) {
  if (atk <= 0) return '없음';
  if (sig.includes('fly')) return '비행';
  if (sig.includes('split')) return '양옆';
  return '정면';
}
function rangeLines(sig, atk, kws) {
  const L = [];
  if (atk <= 0) L.push('공격하지 않습니다.');
  else if (sig.includes('fly')) L.push('<b>비행</b>: 앞 카드를 넘어가 전선 게이지를 바로 밉니다(한 번에 최대 3칸). 정면 적이 경계를 가지고 있으면 그 적을 공격합니다.');
  else if (sig.includes('split')) L.push('<b>양옆</b>: 자기 정면 대신 왼쪽과 오른쪽 칸을 공격합니다. 비어 있는 쪽은 전선 게이지를 밉니다.');
  else L.push('<b>정면</b>: 정면 칸의 적을 공격하고, 비어 있으면 전선 게이지를 밉니다.');
  if (sig.includes('guard')) L.push('<b>수호</b>: 옆 칸이 비어 있을 때, 그 칸으로 오는 공격을 대신 막으러 이동합니다.');
  if (sig.includes('watch')) L.push('<b>경계</b>: 정면으로 오는 비행 공격을 막습니다.');
  if (sig.includes('thorn')) L.push('<b>가시</b>: 이 카드를 공격한 카드가 1 피해를 받습니다.');
  if (sig.includes('cheer')) L.push('<b>격려</b>: 양옆 아군의 공격이 +1 됩니다.');
  if (sig.includes('pierce')) L.push('<b>관통</b>: 정면 적을 처치하고 남은 피해만큼 전선 게이지를 밉니다.');
  if (kws && kws.includes('devote')) L.push('<b>헌신</b>: 양옆 아군이 받는 피해 1을 대신 받습니다.');
  return L;
}
function rowOf(side) { return side === 'p' ? S.p : side === 'e' ? S.e : S.tele; }
function rangeOf(u, side, lane) {
  const atkSide = side === 't' ? 'e' : side;
  const opp = atkSide === 'p' ? 'e' : 'p';
  const oppRow = rowOf(opp); const ownRow = rowOf(atkSide);
  const res = { cells: [], front: null };
  const add = (sd, ln, kind, tag) => res.cells.push({ side: sd, lane: ln, kind, tag });
  add(side, lane, 'src', '');
  const atk = side === 't' ? u.atk : effAtk(u, side, lane);
  const blocked = atkSide === 'p' && u.sig.includes('coward') && S.stress >= 50;
  if (atk > 0 && !blocked) {
    const lanes = u.sig.includes('split') ? [lane - 1, lane + 1].filter(n => n >= 0 && n < 4) : [lane];
    for (const t of lanes) {
      const d = oppRow[t];
      if (u.sig.includes('fly')) {
        if (d && d.sig.includes('watch')) add(opp, t, 'atk', '경계에 막힘');
        else { res.front = '비행'; add(opp, t, 'fly', '넘어가서 게이지 밀기'); }
        continue;
      }
      if (d) { add(opp, t, 'atk', `공격 ${atk}`); continue; }
      const g = [t - 1, t + 1].find(n => n >= 0 && n < 4 && oppRow[n] && oppRow[n].sig.includes('guard'));
      if (g !== undefined) { add(opp, t, 'atk', '수호가 막으러 옴'); add(opp, g, 'guard', '수호'); }
      else { add(opp, t, 'atk', '빈 칸, 게이지 밀기'); res.front = `전선 ${atk}`; }
    }
  }
  if (u.card && u.card.gift && u.card.gift.note) parts.push(`<p class="soft small">${esc(u.card.gift.note)}</p>`);
  const kws = u.comp ? kwsOf(compById(u.comp)) : [];
  for (const n of [lane - 1, lane + 1]) {
    if (n < 0 || n > 3) continue;
    if (u.sig.includes('cheer')) add(atkSide, n, 'buff', '격려 +1');
    if (u.sig.includes('guard') && !ownRow[n]) add(atkSide, n, 'guard', '수호 범위');
    if (kws.includes('devote') && ownRow[n]) add(atkSide, n, 'guard', '헌신');
  }
  return res;
}
function miniHtml(sig, atk, kws) {
  const top = ['', '', '']; const bot = ['', 'self', ''];
  if (atk > 0) {
    if (sig.includes('fly')) top[1] = 'fly';
    else if (sig.includes('split')) { top[0] = 'atk'; top[2] = 'atk'; }
    else top[1] = 'atk';
  }
  if (sig.includes('cheer')) { bot[0] = 'buff'; bot[2] = 'buff'; }
  if (sig.includes('guard') || (kws && kws.includes('devote'))) { bot[0] = bot[0] || 'guard'; bot[2] = bot[2] || 'guard'; }
  const lab = { atk: '공격', fly: '넘어감', buff: '격려', guard: sig.includes('guard') ? '수호' : '헌신', self: '이 카드', '': '' };
  const cell = k => `<span class="mc ${k || 'none'}">${lab[k]}</span>`;
  return `<div class="mini">
    <div class="mini-front${sig.includes('fly') && atk > 0 ? ' on' : ''}">전선${sig.includes('fly') && atk > 0 ? ' 비행' : ''}</div>
    <div class="mini-row">${top.map(cell).join('')}</div>
    <div class="mini-row">${bot.map(cell).join('')}</div>
  </div>`;
}

function sigText(sig) { return sig.map(s => SIGILS[s].name).join(' '); }
function slotHtml(u, side, lane) {
  const cls = ['slot', side];
  let targetable = false;

  if (UI.mode === 'cmd') {
    const t = COMMANDS[S.pro.cmd].target;

    if (t === 'shift' && side === 'p' && ((UI.from == null && u) || (UI.from != null && !u))) targetable = true;

  }

  if (fx) {
    const opp = fx.side === 'p' ? 'e' : 'p';

    if (fx.type === 'hit' && side === opp && fx.t === lane) { cls.push('fx-hit'); pop = `<span class="pop">−${fx.dmg}</span>`; }
    if (fx.type === 'thorn' && side === fx.side && fx.aLane === lane) { cls.push('fx-hit'); pop = `<span class="pop">−${fx.dmg}</span>`; }
    if (fx.type === 'die' && side === fx.side && fx.lane === lane) cls.push('fx-die');
    if (fx.type === 'descend' && side === 'e' && fx.lanes.includes(lane)) cls.push('fx-drop');
    if (fx.type === 'guard' && side === fx.side && fx.to === lane) cls.push('fx-drop');
    if (fx.type === 'poison' && fx.lanes[side] && fx.lanes[side].includes(lane)) { cls.push('fx-hit'); pop = '<span class="pop">−1</span>'; }
    if (fx.type === 'joint' && side === 'p' && fx.lanes.includes(lane)) { cls.push('fx-joint'); }
    if (fx.type === 'joint' && fx.kind === 'comrade' && side === 'e' && fx.target === lane) { cls.push('fx-hit'); pop = '<span class="pop">−1</span>'; }
    if (fx.type === 'grit' && side === 'p' && fx.lane === lane) { cls.push('fx-joint'); pop = `<span class="pop good">${esc(fx.label || '근성!')}</span>`; }
    if (fx.type === 'absorb' && side === 'p' && fx.lane === lane) { cls.push('fx-buff'); pop = `<span class="pop good">스트레스 −${fx.n}</span>`; }

  cls.push('unit');
  if (u.comp) cls.push('comp');
  if (u.boss) cls.push('boss-unit');

  if (u.poison) badges.push('<em class="bd bad">독</em>');
  if (u.wall) badges.push('<em class="bd good">방벽</em>');
  if (u.delay) badges.push('<em class="bd">지연</em>');
  if (u.boss) badges.push('<em class="bd crown">보스</em>');
  else if (u.elite) badges.push('<em class="bd crown">엘리트</em>');
  if (side === 'p' && u.newTurn === S.turn) badges.push('<em class="bd new">이번 턴</em>');
  if (side === 'p' && u.comp && canCharge(u)) { cls.push(ultReady(u) ? 'ult-ready' : ''); badges.push(`<em class="res">${[0, 1, 2].map(i => `<i class="${i < (u.resolve || 0) ? 'on' : ''}"></i>`).join('')}</em>`); }

    <span class="u-badges">${badges.join('')}</span>

  }).join('') || '<span class="soft small">남은 토큰이 없습니다</span>';

    return `<section class="actions"><div class="act-grid">${ghost}</div><div class="end-row"><button class="btn primary end" data-act="skip">건너뛰기</button></div></section>`;
  }
  const cm = COMMANDS[S.pro.cmd];
  const crisisK = ROLES[S.pro.role].crisis;
  const cmdState = S.cmdCd > 0 ? `${S.cmdCd}턴 뒤 사용 가능` : cm.desc;
  const crisisState = S.crisisUsed ? '이번 전투에서 사용함' : crisisReady() ? CRISIS[crisisK].desc : `전선 −${S.frontPush} 이하일 때: ${CRISIS[crisisK].desc}`;
  const dis = b => (b ? '' : ' disabled');
  return `<section class="actions">
    <div class="act-grid">
      <button class="btn act" data-act="extra"${dis(canExtra())}><b>한 번 더</b><small>${S.actionTaken ? '카드를 낸 뒤라 불가' : `토큰 1개 더 뽑기(이번 턴 ${S.extraCount}회 · 최대 3회)`}</small></button>
      <button class="btn act" data-act="exchange"${dis(!S.over && !S.exchangeUsed && S.supply >= 1 && S.tokens.length)}><b>보급 교환</b><small>${S.exchangeUsed ? '이번 턴에 사용함' : '보급 1로 토큰 감정 바꾸기'}</small></button>
      <button class="btn act" data-act="cmd"${dis(cmdReady())}><b>지휘: ${esc(cm.name)}</b><small>${esc(cmdState)}</small></button>
      <button class="btn act crisis" data-act="crisis"${dis(crisisReady())}><b>위기: ${esc(CRISIS[crisisK].name)}</b><small>${esc(crisisState)}</small></button>
    </div>
    ${ultButtonsHtml()}
    <div class="end-row">
      ${UI.mode ? '<button class="btn ghost" data-act="cancel">취소</button>' : ''}
      ${!UI.mode && canUndo() ? `<button class="btn undo" data-act="undo">되돌리기<small>${esc(undoTop().label)}</small></button>` : ''}
      <button class="btn primary end" data-act="end"${dis(!S.over)}>턴 종료</button>
    </div>
  </section>`;
}

/* 궁극기: 준비되면 행동 버튼 아래에 바로 나옵니다 */
function ultButtonsHtml() {
  if (S.over) return '';
  return S.p.map((u, l) => {
    if (!ultReady(u)) return '';
    const c = compById(u.comp); const uname = c.ultName || ULTS[c.role].def;
    return `<button class="btn ult-btn ult-quick" data-act="ult" data-lane="${l}"><b>궁극기: ${esc(uname)}</b><small>${esc(c.name)} · ${esc(ULTS[c.role].desc)}</small></button>`;
  }).join('');
}
function ultNotice() {
  if (!S || S.over || UI.playing) return;
  S.ultNoticed = S.ultNoticed || {};
  for (const u of S.p) {
    if (!ultReady(u) || S.ultNoticed[u.comp]) continue;
    S.ultNoticed[u.comp] = true;
    showFx('toast', `<div class="toast-float ult-toast" role="status">${esc(jo(compById(u.comp).name, '이', '가'))} 궁극기를 쓸 수 있어요!</div>`, 2600);
  }
}
function costHtml(cost) {
  return Object.entries(cost).map(([e, n]) => Array.from({ length: n }, () => `<i class="pip t-${e}" title="${EMO[e]}">${EMO[e][0]}</i>`).join('')).join('');
}
function handHtml() {
  const drawHint = S.deck.length || S.discard.length ? '다음 턴 1장 · 손패 3장 미만이면 보충' : '덱과 버린 더미가 비어 추가로 뽑을 카드 없음';
  const head = `<div class="hand-head"><span>손패 ${S.hand.length}장 <small class="soft">${drawHint}</small></span><button class="btn small-btn" data-act="pile-info">덱 ${S.deck.length}장 · 버린 더미 ${S.discard.length}장</button></div>`;
  if (!S.hand.length) return head + '<section class="hand empty-hand"><span class="soft small">손패가 비었습니다</span></section>';
  return head + `<section class="hand">${S.hand.map((card, i) => {
    const info = cardInfo(card);
    const cls = ['hcard'];
    if (!findPayment(info.cost)) cls.push('dim');
    if (UI.mode === 'play' && UI.sel === i) cls.push('sel');
    if (info.comp) cls.push('comp');
    if (info.desperate) cls.push('desp');
    const c = info.comp ? compById(info.comp) : null;
    const pc = info.comp ? charById(info.comp) : null;
    const pl = info.comp ? proLink(info.comp) : null;
    return `<button class="${cls.join(' ')}" data-hand="${i}">
      ${pc && pc.portrait ? `<img class="av sm corner${frameCls()}" src="${pc.portrait}" alt="">` : ''}
      ${giftArt(card)}
      <span class="cost">${costHtml(info.cost)}</span>
      <span class="h-name">${esc(info.name)}</span>
      <span class="h-sig">${esc(sigText(info.sig))}${pl ? ` <em class="bd link">${PRO_LINKS[pl].name}</em>` : ''}${c && c.status === 'saseon' ? ' <em class="bd bad">사선</em>' : ''}${info.desperate ? ' <em class="bd">절박</em>' : ''}</span>
      <span class="u-stats"><b class="atk">${info.atk}</b><span class="rng">${rangeWord(info.sig, info.atk)}</span><b class="hp">${info.hp}</b></span>
    </button>`;
  }).join('')}</section>`;
}

function sigDescList(sig) { return sig.map(s => `<li><b>${SIGILS[s].name}</b>: ${esc(SIGILS[s].desc)}</li>`).join(''); }
function unitInfo(u, side, lane) {
  const why = [];
  const atk = side === 't' ? u.atk : effAtk(u, side, lane, why);
  const whyTxt = why.map(([nm, n]) => `${esc(nm)} ${n > 0 ? '+' : '−'}${Math.abs(n)}`).join(', ');
  const parts = [`<b class="nm">${esc(u.name)}</b> 공격 ${atk}${why.length && side !== 't' ? ` <span class="soft">(기본 ${u.atk}, ${whyTxt})</span>` : ''}, 체력 ${u.hp} (최대 ${u.maxHp})`];
  const kws = u.comp ? kwsOf(compById(u.comp)) : [];
  // 판 위 카드도 손패 카드처럼 공격 범위 그림을 함께 보여 줍니다(예고 줄 적은 목록만)
  const rl = `<ul class="rlist">${rangeLines(u.sig, atk, kws).map(l => `<li>${l}</li>`).join('')}</ul>`;
  parts.push(side === 't' ? rl : `<div class="range-box">${miniHtml(u.sig, atk, kws)}${rl}</div>`);
  const other = u.sig.filter(x => !['fly', 'split', 'guard', 'watch', 'thorn', 'cheer', 'pierce'].includes(x));
  if (other.length) parts.push(`<ul>${sigDescList(other)}</ul>`);
  parts.push('<div class="soft small">보드에 표시된 칸이 이 카드가 닿는 범위입니다.</div>');
  if (side === 'p' && u.newTurn === S.turn) {
    const top = undoTop();
    if (top && top.uid === u.uid) parts.push('<button class="btn takeback" data-act="undo">이 카드 거두기(토큰 돌려받음)</button>');
    else if (canUndo()) parts.push('<div class="soft small">이 카드를 거두려면 그 뒤에 한 행동부터 되돌리기로 차례대로 취소하세요.</div>');
  }
  if (u.comp) {
    const c = compById(u.comp);
    parts.push(`<div class="soft">${c.merc ? '떠돌이 용병: 관계, 궁극기, 유대가 없습니다.' : `키워드: ${kwsOf(c).map(k => KEYWORDS[k].name).join(', ')}. 유대 ${bondLevel(c)}단계.`}${u.saseonAtPlay ? ' 사선 상태로 나왔기 때문에 쓰러지면 사망합니다.' : ''}</div>`);
    if (side === 'p') parts.push(compExtraHtml(u, lane));
  }
  if (u.poison) parts.push('<div class="soft">독: 매 턴 체력 1을 잃습니다.</div>');
  if (u.delay) parts.push('<div class="soft">지연: 한 턴 늦게 내려옵니다.</div>');
  if (side === 't') parts.push('<div class="soft">다음 적 턴에 이 레인으로 내려옵니다. 칸이 차 있으면 기다립니다.</div>');
  return parts.join('');
}
function compExtraHtml(u, lane) {
  const c = compById(u.comp);
  const out = [];
  const uname = c.ultName || ULTS[c.role].def;
  if (!c.merc && BOND3[c.role]) out.push(bondLevel(c) >= 3 ? `<div class="small good">유대 3단계 · ${BOND3[c.role].name}: ${esc(BOND3[c.role].desc)}</div>` : `<div class="soft small">유대 3단계가 되면 ${BOND3[c.role].name}: ${esc(BOND3[c.role].desc)}</div>`);
  if (c.merc) out.push('<div class="soft small">용병은 궁극기가 없습니다.</div>');
  else if (bondLevel(c) < 2) out.push(`<div class="soft small">궁극기 ${esc(uname)}: 유대 2단계부터 쓸 수 있습니다.</div>`);
  else if (S.ultUsed[u.comp]) out.push(`<div class="soft small">궁극기 ${esc(uname)}: 이번 전투에서 사용했습니다.</div>`);
  else if (ultReady(u)) out.push(`<button class="btn ult-btn" data-act="ult" data-lane="${lane}"><b>궁극기: ${esc(uname)}</b><small>${esc(ULTS[c.role].desc)}</small></button>`);
  else out.push(`<div class="soft small">궁극기 ${esc(uname)}: 결의 ${u.resolve || 0} (발동에 3 필요). 공격하거나 피해를 받을 때 1씩 찹니다.</div>`);
  const pl = proLink(c.id);
  if (pl) out.push(`<div class="joint-line on pro"><b>${esc(S.pro.name)}와(과) ${PRO_LINKS[pl].name}</b>: ${esc(PRO_LINKS[pl].desc)}</div>`.replace(`${esc(S.pro.name)}와(과)`, esc(jo(S.pro.name, '과', '와'))));
  out.push(`<div class="soft small">근성: 쓰러질 피해를 받으면 ${Math.round(gritChance(c) * 100)}% 확률로 체력 1로 버팁니다${S.gritUsed[u.comp] ? '(이번 전투에서 사용함)' : ''}.</div>`);
  const rels = S.comps.filter(o => o.id !== c.id && o.status !== 'dead' && relOf(c.id, o.id));
  for (const o of rels) {
    const t = relOf(c.id, o.id); const key = t.startsWith('crush') ? 'crush' : t;
    const on = S.p.some(v => v && v.comp === o.id);
    const who = t === 'crushTo' ? `${jo(o.name, '을', '를')} 짝사랑` : t === 'crushFrom' ? `${o.name}의 짝사랑 상대` : `${jo(o.name, '과', '와')} ${REL_TYPES[t]}`;
    out.push(`<div class="joint-line${on ? ' on' : ''}"><b>${esc(JOINTS[key].name)}</b> ${esc(who)}: ${esc(t === 'crushFrom' ? '상대 쪽에만 효과가 있습니다' : JOINTS[key].desc)}${on ? '' : ' <span class="soft">(상대가 보드에 없음)</span>'}</div>`);
  }
  return out.join('');
}
function cardInfoHtml(card) {
  const info = cardInfo(card);
  const cost = Object.entries(info.cost).map(([e, n]) => `${EMO[e]} ${n}`).join(', ');
  const parts = [`<b class="nm">${esc(info.name)}</b> 공격 ${info.atk}, 체력 ${info.hp}. 비용 ${cost}`];
  const kws = info.comp ? kwsOf(compById(info.comp)) : [];
  parts.push(`<div class="range-box">${miniHtml(info.sig, info.atk, kws)}<ul class="rlist">${rangeLines(info.sig, info.atk, kws).map(l => `<li>${l}</li>`).join('')}</ul></div>`);
  const other = info.sig.filter(x => !['fly', 'split', 'guard', 'watch', 'thorn', 'cheer', 'pierce'].includes(x));
  if (other.length) parts.push(`<ul>${sigDescList(other)}</ul>`);
  if (info.desperate) parts.push('<div class="soft">절박 카드: 공포 토큰으로만 낼 수 있는 비용이 들어 있습니다.</div>');
  if (info.comp) {
    const c = compById(info.comp);
    parts.push(c.merc ? '<div class="soft">떠돌이 용병: 관계, 궁극기, 유대가 없습니다. 유대 토큰으로 내도 보너스는 없습니다.</div>' : `<div class="soft">키워드: ${kwsOf(c).map(k => KEYWORDS[k].name).join(', ')}. 유대 토큰으로 내면 이번 전투 공격 +1${kwsOf(c).includes('cool') ? '(냉철이라 보너스 없음)' : ''}.</div>`);
    if (c.status === 'saseon') parts.push('<div class="warn">사선 상태입니다. 이번에 쓰러지면 사망합니다.</div>');
  }
  if (!findPayment(info.cost)) parts.push('<div class="warn">지금 가진 토큰으로는 낼 수 없습니다.</div>');
  else parts.push('<div class="soft">놓을 빈 칸을 누르세요.</div>');
  return parts.join('');
}
const CAPTION = {
  hit: f => f.side === 'p' ? `${f.att} → ${f.def}, 피해 ${f.dmg}` : `적 ${f.att} → ${f.def}, 피해 ${f.dmg}`,
  front: f => f.side === 'p' ? `${f.name}: 전선 +${f.a}` : `적 ${f.name}: 전선 −${f.a}`,
  hold: f => `버티기: 적 ${f.name}의 전선 피해 ${f.a}을 막음`,
  thorn: f => `가시: ${f.name} 피해 ${f.dmg}`,
  die: f => f.side === 'p' ? `${f.name} 쓰러짐` : `적 ${f.name} 처치`,
  descend: () => '예고된 적이 내려옵니다',
  guard: f => `${f.name}: 수호로 ${f.to + 1}번 레인을 막아섬`,
  poison: () => '독: 체력 1 감소',
  phase: () => S.enc.phaseCap || '2페이즈 시작',
  joint: f => f.text,
  grit: f => `근성: ${f.name} 체력 1로 버팀`,
  absorb: f => `흡수: ${f.name}, 스트레스 −${f.n}`,
};
function hintHtml(noInfo) {
  if (UI.playing && UI.fx) return `<b class="caption">${esc(CAPTION[UI.fx.type](UI.fx))}</b>`;
  if (UI.info && !noInfo) return UI.info;
  if (UI.mode === 'exchange') return UI.exTok ? '바꿀 감정을 고르세요.' : '보급 1로 바꿀 토큰을 누르세요.';
  if (UI.mode === 'cmd') {
    const t = COMMANDS[S.pro.cmd].target;
    return { ally: '대상 아군 카드를 누르세요.', enemy: '대상 적 카드를 누르세요.', tele: '늦출 예고 카드를 누르세요.', token: UI.exTok ? '바꿀 감정을 고르세요.' : '바꿀 토큰을 누르세요.', shift: UI.from == null ? '옮길 아군 카드를 누르세요.' : '옮겨 갈 빈 칸을 누르세요.' }[t];
  }
  if (S.turn === 1 && !S.actionTaken) return '손패에서 카드를 골라 빈 칸에 내세요. 토큰을 누르면 다음 턴으로 넘길 보관 토큰이 됩니다. 한 번 더는 카드를 내기 전에만 쓸 수 있습니다.';
  return '카드나 보드를 누르면 설명이 나옵니다.';
}

function logHtml() {
  const items = S.log.slice(-14).reverse().map(l => `<li class="lg ${l.kind}"><span class="lt">${l.turn || "–"}</span>${esc(l.text)}</li>`).join('');
  return `<details class="log"${UI.logOpen ? ' open' : ''}><summary>전투 기록</summary><ol>${items}</ol></details>`;
}

function overlayHtml() {
  if ((UI.mode === 'exchange' || (UI.mode === 'cmd' && COMMANDS[S.pro.cmd].target === 'token')) && UI.exTok) {
    return `<div class="sheet"><div class="sheet-body"><p>어떤 감정으로 바꿀까요? ${UI.mode === 'cmd' ? `지휘: ${esc(COMMANDS[S.pro.cmd].name)}` : '보급 1을 씁니다.'}</p>
      <div class="emo-pick">${BASIC.map(e => `<button class="tok t-${e}" data-emo="${e}">${EMO[e]}</button>`).join('')}</div>
      <button class="btn ghost" data-act="cancel">취소</button></div></div>`;
  }
  if (!S.over || UI.playing) return '';
  const mapMode = RUN && RUN.mode === 'map';
  const again = mapMode
    ? (S.over === 'runover' ? '<div class="res-btns col"><button class="btn primary" data-act="to-runend">런 결과 보기</button></div>'
      : S.over === 'win' ? `<div class="res-btns col"><button class="btn primary" data-act="to-reward">${S.enc.boss ? '스테이지 돌파' : '전리품 받기'}</button></div>`
      : S.enc.boss ? '<div class="res-btns col"><button class="btn primary" data-act="to-runend">런 결과 보기</button></div>'
      : '<div class="res-btns col"><button class="btn primary" data-act="back-map">맵으로</button></div>')
    : S.over === 'runover'
    ? '<div class="res-btns"><button class="btn primary" data-act="again">같은 파티로 새 런</button><button class="btn" data-act="setup">설정 바꾸기</button></div>'
    : '<div class="res-btns col"><button class="btn primary" data-act="to-camp">야영하기</button><button class="btn" data-act="next-battle">야영 없이 다음 전투</button><button class="btn ghost" data-act="setup">런 그만두기</button></div>';
  if (S.over === 'lose') {
    const alive = S.comps.filter(c => c.status !== 'dead');
    return `<div class="sheet"><div class="sheet-body"><h2>전선이 무너졌습니다</h2>
      <p>동료 한 명을 남겨 두고 후퇴할 수 있습니다. 남긴 동료는 이번 런에서 사망합니다.</p>
      <div class="sac">${alive.map(c => `<button class="btn" data-sac="${c.id}">${jo(esc(c.name), '을', '를')} 남기고 후퇴<small>${c.status === 'saseon' ? '사선' : '정상'}, 유대 ${bondLevel(c)}단계</small></button>`).join('')}</div>
      <button class="btn ghost" data-act="giveup">후퇴하지 않기(런 종료)</button></div></div>`;
  }
  const title = { win: '승리', retreated: '후퇴했습니다', runover: '런 종료' }[S.over];
  const lines = [];
  if (S.over === 'win') lines.push(`${S.turn}턴 만에 이겼습니다. 이 상대의 목표 길이는 ${S.enc.target}입니다.`);
  if (S.over === 'runover') lines.push(esc(S.overReason || ''));
  lines.push(`스트레스 ${S.stress}, 보급 ${S.supply}`);
  const cs = S.comps.map(c => `${esc(c.name)}: ${{ ok: '정상', saseon: '사선', dead: '사망' }[c.status]}, 유대 ${bondLevel(c)}단계`).join('<br>');
  return `<div class="sheet"><div class="sheet-body"><h2>${title}</h2><p>${lines.join('<br>')}</p><p class="soft">${cs}</p>${again}</div></div>`;

function renderBattle() {
  if (TUT) tutAdvance();
  const handEl = app.querySelector('.hand');
  const sx = handEl ? handEl.scrollLeft : 0;
  let bossBanner = S.enc.boss && S.turn === 1 && !S.actionTaken && !UI.bossSeen && S.phase === 1 ? `<div class="reveal boss" data-act="boss-ok"><div class="rv-rays" aria-hidden="true"></div><div class="rv-text"><small class="phase-tag">보스 · 페이즈 1 / 2</small><b>${esc(S.enc.name.replace('보스: ', ''))}</b><span>전선 게이지 ±${S.frontMax}. ${esc(S.enc.banner || '')}</span><small>눌러서 시작</small></div></div>` : '';
  if (S.enc.boss && S.phase === 2 && UI.phase2IntroReady && !UI.phase2Seen && !UI.playing && !S.over) {
    const bu = S.e.find(u => u && u.boss);
    bossBanner = `<div class="reveal boss phase2" data-act="phase-ok"><div class="rv-rays" aria-hidden="true"></div><div class="rv-text"><small class="phase-tag">페이즈 2 / 2</small><b>${esc(bu ? bu.name : '보스')}</b>${bu ? `<span class="evo-stats">공격 ${bu.atk} · 체력 ${bu.hp}${bu.sig.length ? ` · ${esc(sigText(bu.sig))}` : ''}</span>` : ''}<span>${esc(S.enc.phase2Text || '')}</span><small>눌러서 계속</small></div></div>`;
  }
  // 설명 창: 손패 카드를 골랐을 때만 손패 바로 아래, 그 밖(판 위 카드·안내)은 원래 자리(토큰 아래)
  const handInfo = UI.mode === 'play' && UI.sel != null && !UI.playing;
  const infoSec = `<section class="info"><div class="info-row"><div>${hintHtml()}</div><button class="btn small-btn gloss-btn" data-act="gloss">용어</button></div></section>`;
  // 손패 카드를 골라도 위쪽 안내 글은 그대로 두고(깜빡임 방지), 카드 설명만 손패 아래에 따로
  const baseSec = `<section class="info"><div class="info-row"><div>${hintHtml(true)}</div><button class="btn small-btn gloss-btn" data-act="gloss">용어</button></div></section>`;
  const handSec = `<section class="info hand-info"><div class="info-row"><div>${hintHtml()}</div></div></section>`;
  app.innerHTML = `<main class="battle${UI.playing ? ' playing' : ''}${S.enc.boss ? ' boss-fight' : ''}">`
    + bossBanner + `
    ${workshopJointHtml()}
    <header class="top">${frontHtml()}${statusHtml()}</header>
    ${TUT ? tutGuideHtml() : ''}
    ${boardHtml()}
    ${tokensHtml()}
    ${handInfo ? baseSec : infoSec}
    ${actionsHtml()}
    ${handHtml()}
    ${handInfo ? handSec : ''}
    ${logHtml()}
    ${!S.enc.boss && !TUT ? '<p class="reserve-note">새 적은 예고 칸에 먼저 나타납니다. 증원은 무한하지 않아요.</p>' : ''}
    ${retryHtml()}
    ${TUT && S.over ? tutOverlayHtml() : overlayHtml()}
    ${pileSheet()}${glossSheet()}
  </main>`;
  const h2 = app.querySelector('.hand');
  if (h2) h2.scrollLeft = sx;
  if (TUT) tutAfterRender();
  if (!TUT) ultNotice();
}

const SCREENS = { settings: () => renderSettings(), report: () => renderArchivedReport(), firstchar: () => renderFirstChar(), ending: () => renderEnding(), 'ending-preview': () => renderEnding(), stage: () => renderStage(), title: () => renderTitle(), story: () => renderStory(), howto: () => renderHowTo(), base: () => renderBase(), prep: () => renderPrep(), setup: () => renderSetup(), roster: () => renderRoster(), edit: () => renderEditor(), camp: () => renderCamp(),
  map: () => renderMap(), event: () => renderEvent(), trade: () => renderTrade(), reward: () => renderReward(), runend: () => renderRunEnd() };
function render() {
  // 턴 재생 중에는 연출 타이머 등이 결과 화면을 끼워 그리지 않게 막습니다(재생이 끝나면 다시 그림)
  if (UI.playing && screen === 'battle') return;
  if (document.documentElement) {
    document.documentElement.dataset.cardSkin = selectedSkin('card');
    document.documentElement.dataset.pageSkin = selectedSkin('page');
  }
  (SCREENS[screen] || renderBattle)();
  saveRunState();
  if (UI.lastScreen !== screen) {
    UI.lastScreen = screen;
    const m = app.querySelector('main');
    if (m && !REDUCED) { m.classList.add('screen-enter'); setTimeout(() => m.classList.remove('screen-enter'), 260); }
  }
}

function renderSnap(sn) {
  const bak = { p: S.p, e: S.e, tele: S.tele, front: S.front, stress: S.stress, turn: S.turn, phase: S.phase, enemyRage: S.enemyRage };
  Object.assign(S, sn);
  try {
    const battle = app.querySelector('.battle.playing');
    const top = battle && battle.querySelector('.top');
    const board = battle && battle.querySelector('.board');
    const caption = battle && battle.querySelector('.info-row > div');
    if (!top || !board || !caption) { renderBattle(); return; }
    top.innerHTML = frontHtml() + statusHtml();
    board.outerHTML = boardHtml();
    caption.innerHTML = hintHtml();
  } finally { Object.assign(S, bak); }
}
const FX_MS = { absorb: 520, hit: 560, front: 560, hold: 520, thorn: 420, die: 440, descend: 480, guard: 440, poison: 480, phase: 1000, joint: 1600, grit: 800 };
/* 관계 행동 연출: 판 위 두 사람의 얼굴과 행동 이름을 띠로 보여 줍니다 */
function jointFxHtml(ev) {
  const j = JOINTS[ev.kind] || { name: '관계' };
  const us = (ev.lanes || []).map(l => ev.snap.p[l]).filter(u => u && u.comp);
  const ids = ev.ids || us.map(u => u.comp);
  const who = ids.map(id => { const c = S.comps.find(x => x.id === id) || (S.pro.id === id ? S.pro : null); return c ? { id, name: c.name } : null; }).filter(Boolean);
  const text = String(ev.text || '').replace(/^[^:]+:\s*/, '');
  return `<div class="cast joint" aria-live="polite"><div class="cast-band joint-band">${who.length ? `<div class="jb-pair">${who.map(w => avatarById(w.id, w.name, 'lg')).join('')}</div>` : ''}<small>관계 행동</small><b>${esc(j.name)}</b><span>${esc(text)}</span></div></div>`;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function playEvents(previewDuration = 0) {
  const evs = S.events.slice(); S.events = [];
  if (!evs.length) { render(); return; }
  const phaseChanged = evs.some(ev => ev.type === 'phase');
  UI.playing = true; UI.skip = false;
  try {
    for (const ev of evs) {
      if (UI.skip) break;
      UI.fx = ev;
      renderSnap(ev.snap);
      if (ev.type === 'joint') showFx('joint', jointFxHtml(ev), (previewDuration || FX_MS.joint) * (REDUCED ? 0.6 : 1));
      await sleep(previewDuration || FX_MS[ev.type] * (REDUCED ? 0.6 : 1));
    }
  } finally {
    UI.playing = false; UI.fx = null;
    if (phaseChanged && S.enc.boss && S.phase === 2 && !S.over) UI.phase2IntroReady = true;
    render();
  }
}

/* ---------- 입력 처리 ---------- */
function doCmd(tg) {
  const r = useCommand(tg);
  resetUI();
  if (!r.ok) { flash(r.msg); return; }
  const cm = COMMANDS[S.pro.cmd];
  const target = tg.lane !== undefined ? { side: cm.target === 'enemy' ? 'e' : cm.target === 'tele' ? 't' : 'p', lanes: [tg.lane] } : tg.to !== undefined ? { side: 'p', lanes: [tg.to] } : null;
  castFx('cmd', cm.name, cm.desc, { target });
  render();
}

function onSlot(side, lane) {
  if (S.over) return;
  if (UI.mode === 'play') {
    if (side !== 'p') { flash('아군 줄의 빈 칸에만 낼 수 있습니다'); return; }
    const r = playCard(UI.sel, lane);
    if (!r.ok) { flash(r.msg || '낼 수 없습니다'); return; }
    resetUI();
    if (S.cutin) { showFx('cutin', cutinHtml(S.cutin), 1800); S.cutin = null; }
    render(); return;
  }
  if (UI.mode === 'cmd') {
    const t = COMMANDS[S.pro.cmd].target;
    if (t === 'ally' && side === 'p') return doCmd({ lane });
    if (t === 'enemy' && side === 'e') return doCmd({ lane });
    if (t === 'tele' && side === 't') return doCmd({ lane });
    if (t === 'shift' && side === 'p') {
      if (UI.from == null) { if (S.p[lane]) { UI.from = lane; render(); } else flash('먼저 옮길 아군 카드를 누르세요'); return; }
      if (lane === UI.from) { UI.from = null; render(); return; }
      return doCmd({ from: UI.from, to: lane });
    }
    flash('이 지휘 스킬의 대상이 아닙니다'); return;
  }
  const u = side === 'p' ? S.p[lane] : side === 'e' ? S.e[lane] : S.tele[lane];
  if (u && UI.focus && UI.focus.side === side && UI.focus.lane === lane) { resetUI(); render(); return; }
  UI.info = u ? unitInfo(u, side, lane) : null;
  UI.focus = u ? { side, lane, range: rangeOf(u, side, lane) } : null;
  render();
}

function onTok(id) {
  if (S.over) return;
  if (UI.mode === 'exchange') { UI.exTok = id; render(); return; }
  if (UI.mode === 'cmd' && COMMANDS[S.pro.cmd].target === 'token') { UI.exTok = id; render(); return; }
  toggleKeep(id);
  render();
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-hand],[data-side],[data-tok],[data-emo],[data-sac]');
  if (el && !el.disabled && !tutAllow(el)) return;
  if (UI.retryAsk && el && !['retry-confirm', 'retry-cancel'].includes(el.dataset.act)) return;
  if (el && el.dataset.act && !el.disabled && (onGameAct(el.dataset.act, el.dataset) || onRunAct(el.dataset.act, el.dataset) || onMenuAct(el.dataset.act, el.dataset))) return;
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (UI.playing) { if (d.act === 'skip') UI.skip = true; return; }
  if (d.act) {
    switch (d.act) {
      case 'start': startBattle(); return;
      case 'again': startBattle(); return;
      case 'setup': screen = 'setup'; render(); return;
      case 'cancel': resetUI(); render(); return;
      case 'undo': { const lb = undo(); resetUI(); if (lb) flash(`되돌림: ${lb}`); else render(); return; }
      case 'extra': {
        const r = extraDraw();
        if (r.bust) flash('버스트! 추가로 뽑은 토큰을 잃었습니다');
        else if (r.saved) flash('공포가 나왔지만 버스트를 면했습니다');
        render(); return;
      }
      case 'exchange': resetUI(); UI.mode = 'exchange'; render(); return;
      case 'cmd': {
        const t = COMMANDS[S.pro.cmd].target;
        if (t === 'none') return doCmd({});
        resetUI(); UI.mode = 'cmd'; render(); return;
      }
      case 'crisis': {
        const k = ROLES[S.pro.role].crisis; const r = useCrisis(); resetUI();
        if (r.ok) castFx('crisis', CRISIS[k].name, CRISIS[k].desc, { target: k === 'counter' ? { side: 'p', lanes: [0, 1, 2, 3] } : null });
        render(); return;
      }
      case 'pile-info': UI.pileOpen = true; render(); return;
      case 'close-pile': UI.pileOpen = false; render(); return;
      case 'end': { resetUI(); endTurn(); const top = app.querySelector('.battle .top'); if (top) top.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); playEvents(); return; }
      case 'giveup': giveUp(); render(); return;
      case 'ult': {
        const u = S.p[+d.lane]; const c = u && u.comp ? compById(u.comp) : null;
        const r = useUlt(+d.lane); resetUI();
        if (!r.ok) { flash(r.msg); return; }
        const line = [...S.log].reverse().find(l => l.kind === 'line');
        castFx('ult', c.ultName || ULTS[c.role].def, line ? line.text : ULTS[c.role].desc, { id: c.id, who: c.name, target: { side: c.role === 'atk' ? 'e' : 'p', lanes: c.role === 'atk' ? [+d.lane] : [0, 1, 2, 3] } });
        render(); return;
      }
    }
  }
  if (d.hand !== undefined) {
    const i = +d.hand;
    if (UI.mode === 'play' && UI.sel === i) { resetUI(); render(); return; }
    resetUI(); UI.mode = 'play'; UI.sel = i; UI.info = cardInfoHtml(S.hand[i]); render(); return;
  }
  if (d.side) { onSlot(d.side, +d.lane); return; }
  if (d.tok) { onTok(+d.tok); return; }
  if (d.emo && UI.mode === 'cmd') { doCmd({ tok: UI.exTok, emo: d.emo }); return; }
  if (d.emo) { const r = exchange(UI.exTok, d.emo); resetUI(); if (!r.ok) flash(r.msg); else render(); return; }
  if (d.sac) { sacrifice(d.sac); render(); }
});

function onMenuAct(act, d) {
  switch (act) {
    case 'to-roster': screen = 'roster'; render(); window.scrollTo(0, 0); return true;
    case 'boss-ok': fadeReveal(() => { UI.bossSeen = true; render(); }); return true;
    case 'phase-ok': fadeReveal(() => { UI.phase2Seen = true; UI.phase2IntroReady = false; render(); }); return true;
    case 'to-camp': syncOnce(); screen = 'camp'; resetUI(); render(); window.scrollTo(0, 0); return true;
    case 'next-battle': syncOnce(); startRunBattle(SETUP.enc); return true;
    case 'depart': startRunBattle(SETUP.enc); return true;
    case 'camp-rest': case 'camp-heal': case 'camp-talk': {
      const r = act === 'camp-rest' ? campRest(RUN) : act === 'camp-heal' ? campHeal(RUN, d.id) : campTalk(RUN, d.id);
      if (!r.ok) flash(r.msg); else render();
      return true;
    }
    case 'to-setup': screen = 'setup'; render(); window.scrollTo(0, 0); return true;
    case 'new-char': if (ROSTER.chars.length < rosterSlots()) openEditor(blankChar()); return true;
    case 'edit-char': openEditor(charById(d.id)); return true;
    case 'cancel-edit': screen = 'roster'; UI.draft = null; render(); return true;
    case 'save-char': saveDraft(); return true;
    case 'clear-portrait': UI.draft.portrait = null; render(); return true;
    case 'show-code': UI.showCode = !UI.showCode; render(); return true;
    case 'copy-code': {
      const ta = app.querySelector('textarea[data-f=codeout]');
      const done = () => flash('코드를 복사했습니다');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); flash('자동 복사가 막혀 있어요. 선택된 코드를 직접 복사하세요'); });
      else { ta.select(); flash('선택된 코드를 직접 복사하세요'); }
      return true;
    }
    case 'delete-char': {
      if (!UI.confirmDel) { UI.confirmDel = true; render(); return true; }
      const id = UI.draft.id;
      ROSTER.chars = ROSTER.chars.filter(c => c.id !== id);
      ROSTER.rels = ROSTER.rels.filter(r => r.a !== id && r.b !== id);
      saveRoster(); screen = 'roster'; UI.draft = null; flash('삭제했습니다'); return true;
    }
    case 'import-char': {
      const ch = parseCharCode(UI.importText);
      if (!ch) { flash('코드를 읽을 수 없습니다. 코드 전체를 붙여 넣었는지 확인하세요'); return true; }
      if (ROSTER.chars.length >= rosterSlots()) { flash('슬롯이 가득 찼습니다'); return true; }
      ch.id = newCharId(); ROSTER.chars.push(ch); saveRoster(); UI.importText = '';
      flash(`${jo(ch.name, '을', '를')} 불러왔습니다. 초상화는 편집에서 등록하세요`); return true;
    }
  }
  return false;
}

app.addEventListener('change', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-save-file]') && t.files && t.files[0]) {
    if (t.files[0].size > 20 * 1024 * 1024) { flash('파일이 너무 큽니다'); return; }
    const fname = t.files[0].name;
    t.files[0].text().then(txt => { UI.saveImportText = txt.trim(); UI.saveFileName = fname; UI.saveImportOpen = true; UI.saveImportAsk = false; flash('파일을 읽었습니다. 불러오기를 눌러 주세요'); }, () => flash('파일을 읽지 못했습니다'));
    return;
  }
  if (t.dataset.p) { PREP[t.dataset.p] = t.value; UI.confirmNew = false; render(); return; }
  if (t.dataset.k) { SETUP[t.dataset.k] = t.value; render(); return; }
  if (screen === 'edit' && UI.draft) {
    const f = t.dataset.f;
    if (f === 'portrait' && t.files && t.files[0]) {
      readPortrait(t.files[0]).then(url => { UI.draft.portrait = url; render(); }, () => flash('이미지를 읽지 못했습니다'));
      return;
    }
    if (['role', 'cmd', 'sigil', 'core', 'speech'].includes(f)) { UI.draft[f] = t.value; render(); return; }
    if (f === 'aux0' || f === 'aux1') { UI.draft.aux[+f.slice(3)] = t.value; render(); return; }
    if (t.dataset.rel !== undefined) { UI.draftRels[t.dataset.rel] = t.value; return; }
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (screen === 'edit' && UI.draft) {
    if (t.dataset.f === 'ultName') UI.draft.ultName = t.value;
    if (t.dataset.f === 'name') { UI.draft.name = t.value; const b = app.querySelector('[data-act=save-char]'); if (b) { const v = draftValid(UI.draft); b.disabled = !v; b.textContent = v ? '저장' : '이름과 키워드를 확인하세요'; } }
    if (t.dataset.line) UI.draft.lines[t.dataset.line] = t.value;
  }
  if (t.dataset.f === 'import') UI.importText = t.value;
});
app.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.log')) UI.logOpen = e.target.open; }, true);

render();
workshopBoot();
</script>
